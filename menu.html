<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<meta
  http-equiv="Cache-Control"
  content="no-cache, no-store, must-revalidate"
/>

<title>Routen</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 20px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

.route {
  background: white;
  padding: 16px;
  border-radius: 12px;
  margin-top: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

#backButton {
  background: #007aff;
  color: white;
  font-weight: bold;
}

</style>

</head>

<body>

<h2>Gespeicherte Routen</h2>

<button id="backButton">
Zurück zur Karte
</button>

<div id="routes">
Lade Routen...
</div>

<script type="module">

// ========================================
// Firebase Imports
// ========================================

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ========================================
// Firebase Config
// ========================================

const firebaseConfig = {
  apiKey: "AIzaSyBg_-8LeU72a-mj_zNyezr4zlXtJoHxi9c",
  authDomain: "ras-gps-route.firebaseapp.com",
  projectId: "ras-gps-route",
  storageBucket: "ras-gps-route.firebasestorage.app",
  messagingSenderId: "200005558812",
  appId: "1:200005558812:web:a6a89a131a35aad57ab5d9"
};

// ========================================
// Firebase starten
// ========================================

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ========================================
// Zurück Button
// ========================================

document
  .getElementById("backButton")
  .addEventListener("click", () => {
    window.location.replace("map.html");
  });

// ========================================
// Routen laden
// ========================================

const container = document.getElementById("routes");
container.innerHTML = "<p>Lade Routen...</p>";

try {
  const querySnapshot = await getDocs(collection(db, "routes"));

  if (querySnapshot.empty) {
    container.innerHTML = "<p>Noch keine Routen gespeichert.</p>";
  } else {
    container.innerHTML = "";

    querySnapshot.forEach((docSnap) => {
      const route = docSnap.data();
      const routeId = docSnap.id;

      container.innerHTML += `
        <div class="route">
          <b>${route.name || "Unbenannte Route"}</b><br><br>
          
          Datum: ${route.date}<br><br>
          Strecke: ${route.distance} km<br><br>
          Fahrzeit: ${route.duration}<br><br>
          Punkte: ${route.points ? route.points.length : 0}<br><br>

          <button onclick="showRoute('${routeId}')">
            Route anzeigen
          </button>

          <button onclick="deleteRoute('${routeId}')" style="background:#ff3b30; color:white;">
            Route löschen
          </button>
        </div>
      `;
    });
  }
} catch (e) {
  console.error(e);
  container.innerHTML = `<p style="color:red;">Fehler beim Laden der Routen.<br><small>${e.message}</small></p>`;
}

// ========================================
// Route anzeigen
// ========================================

window.showRoute = function (routeId) {
  localStorage.setItem("selectedRouteId", routeId);
  window.location.replace("map.html");
};

// ========================================
// Route löschen
// ========================================

window.deleteRoute = async function (routeId) {
  const ok = confirm("Route wirklich löschen?");
  if (!ok) return;

  try {
    await deleteDoc(doc(db, "routes", routeId));
    alert("Route gelöscht");
    location.reload();
  } catch (e) {
    console.error(e);
    alert("Fehler beim Löschen: " + e.message);
  }
};

</script>

</body>
</html>
