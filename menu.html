<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Routen</title>

<style>

body {

  font-family: Arial;

  background: #f2f2f2;

  margin: 0;

  padding: 20px;
}

button {

  width: 100%;

  padding: 14px;

  margin-top: 10px;

  border: none;

  border-radius: 10px;

  font-size: 16px;
}

.route {

  background: white;

  padding: 16px;

  border-radius: 12px;

  margin-top: 16px;
}

</style>

</head>

<body>

<h2>Gespeicherte Routen</h2>

<button onclick="backToMap()">
Zurück zur Karte
</button>

<div id="routes">
Lade Routen...
</div>

<script type="module">

// ========================================
// Firebase Imports
// ========================================

import {

  initializeApp

} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

  getFirestore,

  collection,
  getDocs,

  deleteDoc,
  doc

} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ========================================
// Firebase Config
// ========================================

const firebaseConfig = {

  apiKey:
    "DEINE_API_KEY",

  authDomain:
    "DEIN_PROJECT.firebaseapp.com",

  projectId:
    "DEIN_PROJECT",

  storageBucket:
    "DEIN_PROJECT.appspot.com",

  messagingSenderId:
    "123456789",

  appId:
    "DEINE_APP_ID"
};

// ========================================
// Firebase starten
// ========================================

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

// ========================================
// Routen laden
// ========================================

const container =
  document.getElementById(
    "routes"
  );

container.innerHTML = "";

const querySnapshot =

  await getDocs(
    collection(db, "routes")
  );

// ========================================
// Anzeige
// ========================================

querySnapshot.forEach(
  (docSnap) => {

    const route =
      docSnap.data();

    const routeId =
      docSnap.id;

    container.innerHTML += `

      <div class="route">

        <b>${route.name}</b><br><br>

        Datum:
        ${route.date}<br><br>

        Strecke:
        ${route.distance} km<br><br>

        Fahrzeit:
        ${route.duration}<br><br>

        Punkte:
        ${route.points.length}<br><br>

        <button
          onclick="showRoute('${routeId}')"
        >
          Route anzeigen
        </button>

        <button
          onclick="deleteRoute('${routeId}')"
        >
          Route löschen
        </button>

      </div>
    `;
  }
);

// ========================================
// Route anzeigen
// ========================================

window.showRoute =
function (routeId) {

  localStorage.setItem(
    "selectedRouteId",
    routeId
  );

  window.location =
    "map.html";
};

// ========================================
// Route löschen
// ========================================

window.deleteRoute =
async function (routeId) {

  const ok =
    confirm(
      "Route löschen?"
    );

  if (!ok) {

    return;
  }

  await deleteDoc(

    doc(
      db,
      "routes",
      routeId
    )
  );

  location.reload();
};

// ========================================
// Zurück
// ========================================

window.backToMap =
function () {

  window.location =
    "map.html";
};

</script>

</body>
</html>
