<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>GPS Menü</title>

<style>

body {

  font-family: Arial;

  background: #f2f2f2;

  margin: 0;

  padding: 20px;
}

button {

  width: 100%;

  padding: 14px;

  margin-top: 10px;

  border: none;

  border-radius: 10px;

  font-size: 18px;
}

.card {

  background: white;

  padding: 16px;

  border-radius: 12px;

  margin-top: 16px;
}

</style>

</head>

<body>

<h2>GPS Menü</h2>

<button onclick="backToMap()">
Zurück zur Karte
</button>

<div class="card">

  <h3>Aktuelle Route</h3>

  <div id="routeInfo"></div>

</div>

<div class="card">

  <h3>Aktionen</h3>

  <button onclick="showRoute()">
    Route anzeigen
  </button>

  <button onclick="deleteRoute()">
    Route löschen
  </button>

</div>

<script>

// ------------------------------------
// Daten laden
// ------------------------------------

const route =
  JSON.parse(
    localStorage.getItem(
      "routePoints"
    ) || "[]"
  );

const distance =
  localStorage.getItem(
    "distanceKm"
  ) || 0;

// ------------------------------------
// Anzeige
// ------------------------------------

document.getElementById(
  "routeInfo"
).innerHTML = `

  Punkte:
  ${route.length}<br><br>

  Strecke:
  ${distance} km
`;

// ------------------------------------
// Karte
// ------------------------------------

function backToMap() {

  window.location =
    "map.html";
}

// ------------------------------------
// Route anzeigen
// ------------------------------------

function showRoute() {

  alert(
    `Route enthält ${route.length} Punkte`
  );
}

// ------------------------------------
// Löschen
// ------------------------------------

function deleteRoute() {

  const ok =
    confirm(
      "Route löschen?"
    );

  if (!ok) {

    return;
  }

  localStorage.removeItem(
    "routePoints"
  );

  localStorage.removeItem(
    "distanceKm"
  );

  alert(
    "Route gelöscht"
  );

  location.reload();
}

</script>

</body>
</html>
