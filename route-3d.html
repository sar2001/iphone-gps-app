<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route 3D</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
<style>
body, html { margin: 0; padding: 0; font-family: Arial, sans-serif; height: 100%; }
#map { position: absolute; top: 0; left: 280px; right: 0; bottom: 0; }
#sidebar {
  position: absolute; top: 0; left: 0; width: 280px; bottom: 0;
  background: #1c1c1e; overflow-y: auto; padding: 12px;
  border-right: 1px solid #333; box-sizing: border-box; color: #fff;
}
#sidebar h2 { margin: 0 0 12px 0; font-size: 18px; }
#authStatus { font-size: 12px; color: #888; margin-bottom: 12px; }
#btn3d {
  position: absolute; bottom: 20px; left: 300px; z-index: 9999;
  padding: 8px 16px; border: none; border-radius: 8px;
  background: #ff3b30; color: #fff; font-size: 14px; cursor: pointer;
}
.route-item {
  padding: 10px; margin-bottom: 8px; background: #2c2c2e; border-radius: 8px;
  cursor: pointer; border: 2px solid transparent; transition: border-color 0.2s;
}
.route-item.active { border-color: #007aff; }
.route-item .name { font-weight: bold; font-size: 14px; }
.route-item .meta { font-size: 12px; color: #888; margin-top: 2px; }
.route-item .color-dot {
  display: inline-block; width: 12px; height: 12px; border-radius: 6px;
  margin-right: 6px; vertical-align: middle;
}
@media (max-width: 600px) {
  #sidebar { width: 100%; height: 200px; bottom: auto; border-right: none; border-bottom: 1px solid #333; }
  #map { left: 0; top: 200px; }
  #btn3d { left: 20px; bottom: 220px; }
}
</style>
</head>
<body>
<div id="sidebar">
  <h2>🏔 Route 3D</h2>
  <div id="authStatus">Verbinde...</div>
  <div id="routeList"></div>
</div>
<div id="map"></div>
<button id="btn3d" onclick="toggle3D()">3D: AN</button>

<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script>
var map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      osm: {
        type: 'raster',
        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize: 256,
        attribution: '&copy; OpenStreetMap'
      },
      terrain: {
        type: 'raster-dem',
        tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
        tileSize: 256,
        maxzoom: 15,
        encoding: 'terrarium'
      }
    },
    layers: [{
      id: 'osm',
      type: 'raster',
      source: 'osm'
    }]
  },
  center: [10.4515, 51.1657],
  zoom: 6,
  pitch: 60,
  bearing: 0,
  antialias: true
});

map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

map.on('load', function() {
  map.setTerrain({ source: 'terrain', exaggeration: 1.5 });
});

var is3D = true;

function toggle3D() {
  is3D = !is3D;
  if (is3D) {
    map.setTerrain({ source: 'terrain', exaggeration: 1.5 });
    map.setPitch(60);
    document.getElementById("btn3d").textContent = "3D: AN";
    document.getElementById("btn3d").style.background = "#ff3b30";
  } else {
    map.setTerrain(null);
    map.setPitch(0);
    document.getElementById("btn3d").textContent = "3D: AUS";
    document.getElementById("btn3d").style.background = "#555";
  }
}

const API_KEY = "AIzaSyBg_-8LeU72a-mj_zNyezr4zlXtJoHxi9c";
const PROJECT_ID = "ras-gps-route";
var fbToken = null;
var allRoutes = [];
var routeLayers = {};
var colors = ["#ff3b30", "#34c759", "#007aff", "#ff9500", "#af52de", "#00c7be", "#ff2d55", "#5856d6"];

function fbSignIn() {
  fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + API_KEY, {
    method: "POST",
    body: JSON.stringify({ returnSecureToken: true })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.idToken) {
      fbToken = d.idToken;
      document.getElementById("authStatus").textContent = "✓ Verbunden";
      loadRoutes();
    } else {
      document.getElementById("authStatus").textContent = "✗ Auth Fehler";
    }
  })
  .catch(function() {
    document.getElementById("authStatus").textContent = "✗ Netzwerk Fehler";
  });
}

function loadRoutes() {
  if (!fbToken) return;
  var url = "https://firestore.googleapis.com/v1/projects/" + PROJECT_ID +
    "/databases/(default)/documents/routes?orderBy=timestamp%20desc";
  fetch(url, { headers: { "Authorization": "Bearer " + fbToken } })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    allRoutes = data.documents || [];
    document.getElementById("authStatus").textContent = "✓ " + allRoutes.length + " Routen";
    renderRouteList();
    if (allRoutes.length === 1) showRoute(0);
  })
  .catch(function() {
    document.getElementById("authStatus").textContent = "✗ Lade Fehler";
  });
}

function renderRouteList() {
  var html = "";
  for (var i = 0; i < allRoutes.length; i++) {
    var f = allRoutes[i].fields;
    var name = f.name ? f.name.stringValue : "Unbenannt";
    var dist = f.totalDistance ? (f.totalDistance.doubleValue / 1000).toFixed(2) : "?";
    var color = colors[i % colors.length];
    var active = routeLayers[i] ? " active" : "";
    html +=
      "<div class='route-item" + active + "' onclick='toggleRoute(" + i + ")'>" +
        "<div class='name'><span class='color-dot' style='background:" + color + "'></span>" + name + "</div>" +
        "<div class='meta'>" + dist + " km</div>" +
      "</div>";
  }
  document.getElementById("routeList").innerHTML = html || "<em>Keine Routen</em>";
}

function toggleRoute(index) {
  if (routeLayers[index]) { hideRoute(index); }
  else { showRoute(index); }
}

function showRoute(index) {
  if (routeLayers[index]) return;
  var doc = allRoutes[index];
  var geo = JSON.parse(doc.fields.geoJSON.stringValue);
  var coords = geo.features[0].geometry.coordinates;
  var color = colors[index % colors.length];
  var id = "route-" + index;

  map.addSource(id, {
    type: 'geojson',
    data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } }
  });
  map.addLayer({
    id: id,
    type: 'line',
    source: id,
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': color, 'line-width': 4, 'line-opacity': 0.8 }
  });
  routeLayers[index] = id;

  var bounds = coords.reduce(function(b, c) {
    return [[Math.min(b[0][0], c[0]), Math.min(b[0][1], c[1])],
            [Math.max(b[1][0], c[0]), Math.max(b[1][1], c[1])]];
  }, [[coords[0][0], coords[0][1]], [coords[0][0], coords[0][1]]]);
  if (Object.keys(routeLayers).length === 1) {
    map.fitBounds(bounds, { padding: 60, maxZoom: 14 });
  }

  var wps = geo.features[0].properties.waypoints;
  if (wps) {
    var wpSource = id + "-wp";
    var wpFeatures = [];
    for (var i = 0; i < wps.length; i++) {
      wpFeatures.push({
        type: 'Feature',
        geometry: { type: 'Point', coordinates: [wps[i].lng, wps[i].lat] },
        properties: { label: wps[i].label || "HP " + (i + 1), photo: wps[i].photo || null }
      });
    }
    map.addSource(wpSource, {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: wpFeatures }
    });
    map.addLayer({
      id: wpSource,
      type: 'circle',
      source: wpSource,
      paint: {
        'circle-color': color, 'circle-radius': 8,
        'circle-stroke-width': 2, 'circle-stroke-color': '#fff'
      }
    });
    routeLayers["wp_" + index] = wpSource;

    map.on('click', wpSource, function(e) {
      var props = e.features[0].properties;
      var html = "<b>" + props.label + "</b>";
      if (props.photo) html += "<br><img src='" + props.photo + "' style='width:150px;border-radius:8px;margin-top:4px'>";
      new maplibregl.Popup().setLngLat(e.lngLat).setHTML(html).addTo(map);
    });
    map.on('mouseenter', wpSource, function() { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', wpSource, function() { map.getCanvas().style.cursor = ''; });
  }
  renderRouteList();
}

function hideRoute(index) {
  var id = routeLayers[index];
  if (id) {
    map.removeLayer(id);
    map.removeSource(id);
    delete routeLayers[index];
  }
  var wpId = routeLayers["wp_" + index];
  if (wpId) {
    map.removeLayer(wpId);
    map.removeSource(wpId);
    delete routeLayers["wp_" + index];
  }
  renderRouteList();
}

fbSignIn();
</script>
</body>
</html>
