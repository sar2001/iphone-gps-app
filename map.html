<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>GPS Map</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<style>

html, body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;
}

#map {

  width: 100%;
  height: 100vh;
}

/* Menü */

#menuButton {

  position: fixed;

  top: 10px;
  left: 10px;

  z-index: 9999;

  width: 50px;
  height: 50px;

  border: none;

  border-radius: 10px;

  background: white;

  font-size: 28px;

  box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

/* Zentrieren */

#centerButton {

  position: fixed;

  top: 70px;
  left: 10px;

  z-index: 9999;

  width: 50px;
  height: 50px;

  border: none;

  border-radius: 10px;

  background: white;

  font-size: 24px;

  box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

/* Tracking */

#trackingButton {

  position: fixed;

  bottom: 20px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 9999;

  padding: 14px 24px;

  border: none;

  border-radius: 14px;

  background: #007aff;

  color: white;

  font-size: 18px;

  box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

</style>

</head>

<body>

<button
  id="menuButton"
  onclick="openMenu()"
>
☰
</button>

<button
  id="centerButton"
  onclick="centerMap()"
>
◎
</button>

<button
  id="trackingButton"
  onclick="toggleTracking()"
>
Tracking starten
</button>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ------------------------------------
// Karte
// ------------------------------------

const map =
  L.map('map')
  .setView([51.505, -0.09], 13);

// ------------------------------------
// OSM
// ------------------------------------

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution:
      '&copy; OpenStreetMap contributors'
  }
).addTo(map);

// ------------------------------------
// Marker
// ------------------------------------

const marker =
  L.marker([51.505, -0.09])
  .addTo(map);

// ------------------------------------
// Linie
// ------------------------------------

let routeLine =
  L.polyline([], {
    color: 'blue'
  }).addTo(map);

// ------------------------------------
// Variablen
// ------------------------------------

let currentLat = null;

let currentLng = null;

let tracking = false;

let routePoints = [];

// ------------------------------------
// GPS
// ------------------------------------

navigator.geolocation.watchPosition(

  (position) => {

    const lat =
      position.coords.latitude;

    const lng =
      position.coords.longitude;

    currentLat = lat;

    currentLng = lng;

    marker.setLatLng([lat, lng]);

    if (!window.firstCenter) {

      map.setView([lat, lng], 17);

      window.firstCenter = true;
    }

    // Tracking

    if (tracking) {

      routePoints.push(
        [lat, lng]
      );

      routeLine.setLatLngs(
        routePoints
      );
    }
  },

  (err) => {

    console.error(err);
  },

  {
    enableHighAccuracy: true
  }
);

// ------------------------------------
// Menü öffnen
// ------------------------------------

function openMenu() {

  localStorage.setItem(
    "currentRoute",
    JSON.stringify(routePoints)
  );

  window.location =
    "menu.html";
}

// ------------------------------------
// Zentrieren
// ------------------------------------

function centerMap() {

  if (
    currentLat &&
    currentLng
  ) {

    map.setView(
      [currentLat, currentLng],
      17
    );
  }
}

// ------------------------------------
// Tracking
// ------------------------------------

function toggleTracking() {

  tracking = !tracking;

  const btn =
    document.getElementById(
      "trackingButton"
    );

  if (tracking) {

    btn.innerText =
      "Tracking stoppen";

  } else {

    btn.innerText =
      "Tracking starten";
  }
}

</script>

</body>
</html>
