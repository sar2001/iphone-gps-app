<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>GPS Map V2</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
#map { width:100%; height:100vh; }

#menuButton, #centerButton {
  position:fixed; top:10px; left:10px; z-index:9999;
  width:50px; height:50px; border:none; border-radius:10px;
  background:white; font-size:28px; box-shadow:0 0 10px rgba(0,0,0,0.3);
}
#centerButton { top:70px; font-size:24px; }

#trackingButton {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  z-index:9999; padding:14px 24px; border:none; border-radius:14px;
  background:#007aff; color:white; font-size:18px; box-shadow:0 0 10px rgba(0,0,0,0.3);
  min-width: 220px;
}

#status {
  position:fixed; top:130px; left:10px; right:10px; z-index:9999;
  background:white; padding:12px; border-radius:12px; text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
  font-size:15px;
}
</style>
</head>
<body>

<button id="menuButton">☰</button>
<button id="centerButton">◎</button>
<button id="trackingButton">GPS wird gesucht...</button>

<div id="status">Warte auf GPS-Signal...</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBg_-8LeU72a-mj_zNyezr4zlXtJoHxi9c",
  authDomain: "ras-gps-route.firebaseapp.com",
  projectId: "ras-gps-route",
  storageBucket: "ras-gps-route.firebasestorage.app",
  messagingSenderId: "200005558812",
  appId: "1:200005558812:web:a6a89a131a35aad57ab5d9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const map = L.map("map").setView([51.505, -0.09], 13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

const marker = L.marker([51.505, -0.09]).addTo(map);
let routeLine = L.polyline([], { color: "blue", weight: 5 }).addTo(map);

let currentLat = null, currentLng = null;
let tracking = false;
let routePoints = [];
let totalDistance = 0;
let startTime = null;
let lastLat = null, lastLng = null;
let gpsReady = false;

function distanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Erster Versuch mit getCurrentPosition + watchPosition
function startGPS() {
  navigator.geolocation.getCurrentPosition((position) => {
    handlePosition(position);
  }, (error) => {
    console.error("getCurrentPosition Error:", error);
  }, { enableHighAccuracy: true, timeout: 10000 });

  navigator.geolocation.watchPosition(handlePosition, (error) => {
    console.error("watchPosition Error:", error);
    document.getElementById("status").innerHTML = "GPS-Fehler: " + error.message;
  }, { 
    enableHighAccuracy: true, 
    maximumAge: 0, 
    timeout: 30000 
  });
}

function handlePosition(position) {
  const lat = position.coords.latitude;
  const lng = position.coords.longitude;
  const speed = (position.coords.speed || 0) * 3.6;

  currentLat = lat;
  currentLng = lng;
  marker.setLatLng([lat, lng]);

  if (!window.firstCenter) {
    map.setView([lat, lng], 17);
    window.firstCenter = true;
  }

  if (!gpsReady) {
    gpsReady = true;
    const btn = document.getElementById("trackingButton");
    btn.textContent = "Tracking starten";
    btn.classList.add("enabled");
    document.getElementById("status").innerHTML = "GPS-Signal empfangen ✓";
    console.log("✅ GPS bereit auf iPhone");
  }

  if (tracking) {
    if (routePoints.length === 0) {
      routePoints = [[lat, lng]];
      routeLine.setLatLngs(routePoints);
      lastLat = lat;
      lastLng = lng;
    } else if (lastLat !== null) {
      const dist = distanceMeters(lastLat, lastLng, lat, lng);
      if (dist > 4) {
        totalDistance += dist;
        routePoints.push([lat, lng]);
        routeLine.setLatLngs(routePoints);
        lastLat = lat;
        lastLng = lng;
      }
    }
    updateStats(speed);
  }
}

function updateStats(speed) {
  let duration = "00:00:00";
  if (startTime) {
    const sec = Math.floor((Date.now() - startTime) / 1000);
    duration = `${String(Math.floor(sec/3600)).padStart(2,'0')}:${String(Math.floor((sec%3600)/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
  }
  document.getElementById("stats").innerHTML = `
    Geschwindigkeit: ${speed.toFixed(1)} km/h<br><br>
    Strecke: ${(totalDistance / 1000).toFixed(2)} km<br><br>
    Fahrzeit: ${duration}
  `;
}

// Button
document.getElementById("trackingButton").addEventListener("click", () => {
  if (!gpsReady) {
    alert("GPS wird noch gesucht.\n\nBitte erlaube die Ortung für Safari.");
    return;
  }

  // ... Rest der Toggle-Logik bleibt gleich wie vorher ...
  const btn = document.getElementById("trackingButton");
  const statsBox = document.getElementById("stats");

  if (!tracking) {
    tracking = true;
    routePoints = [];
    totalDistance = 0;
    startTime = Date.now();
    lastLat = null;
    lastLng = null;
    routeLine.setLatLngs([]);

    btn.textContent = "Tracking stoppen";
    btn.style.background = "#ff3b30";
    statsBox.classList.add("active");
  } else {
    tracking = false;
    btn.textContent = "Tracking starten";
    btn.style.background = "#007aff";

    if (routePoints.length < 2) {
      statsBox.classList.remove("active");
      alert("Keine Route aufgezeichnet.");
      return;
    }

    const routeName = prompt("Name der Route:", "Meine Route") || "Route";
    const date = new Date().toLocaleDateString();
    const sec = Math.floor((Date.now() - startTime) / 1000);
    const duration = `${String(Math.floor(sec/3600)).padStart(2,'0')}:${String(Math.floor((sec%3600)/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;

    const pointsForFirestore = routePoints.map(p => ({ lat: p[0], lng: p[1] }));

    addDoc(collection(db, "routes"), {
      name: routeName,
      date: date,
      distance: (totalDistance / 1000).toFixed(2),
      duration: duration,
      points: pointsForFirestore,
      created: Date.now()
    }).then(() => alert(`✅ Route "${routeName}" gespeichert!`))
      .catch(e => alert("Fehler: " + e.message));

    setTimeout(() => statsBox.classList.remove("active"), 5000);
  }
});

document.getElementById("menuButton").addEventListener("click", () => location.replace("menu.html"));
document.getElementById("centerButton").addEventListener("click", () => {
  if (currentLat && currentLng) map.setView([currentLat, currentLng], 17);
});

// GPS starten
startGPS();

</script>
</body>
</html>
