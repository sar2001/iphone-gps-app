<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<meta
  http-equiv="Cache-Control"
  content="no-cache, no-store, must-revalidate"
/>

<title>GPS Map</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<style>

html, body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;
}

#map {

  width: 100%;
  height: 100vh;
}

/* Menü */

#menuButton {

  position: fixed;

  top: 10px;
  left: 10px;

  z-index: 9999;

  width: 50px;
  height: 50px;

  border: none;

  border-radius: 10px;

  background: white;

  font-size: 28px;

  box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

/* Zentrieren */

#centerButton {

  position: fixed;

  top: 70px;
  left: 10px;

  z-index: 9999;

  width: 50px;
  height: 50px;

  border: none;

  border-radius: 10px;

  background: white;

  font-size: 24px;

  box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

/* Tracking */

#trackingButton {

  position: fixed;

  bottom: 20px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 9999;

  padding: 14px 24px;

  border: none;

  border-radius: 14px;

  background: #007aff;

  color: white;

  font-size: 18px;

  box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

/* Statistik */

#stats {

  position: fixed;

  right: 10px;
  top: 10px;

  z-index: 9999;

  background: white;

  padding: 12px;

  border-radius: 12px;

  width: 180px;

  font-size: 14px;

  box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

</style>

</head>

<body>

<button
  id="menuButton"
  onclick="openMenu()"
>
☰
</button>

<button
  id="centerButton"
  onclick="centerMap()"
>
◎
</button>

<button
  id="trackingButton"
  onclick="toggleTracking()"
>
Tracking starten
</button>

<div id="stats">

  Geschwindigkeit:
  0 km/h<br><br>

  Strecke:
  0 km<br><br>

  Fahrzeit:
  00:00:00

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

// ========================================
// Firebase Imports
// ========================================

import {

  initializeApp

} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

  getFirestore,

  collection,
  addDoc,

  getDoc,
  doc

} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ========================================
// Firebase Config
// ========================================

const firebaseConfig = {

  apiKey:
    "DEINE_API_KEY",

  authDomain:
    "DEIN_PROJECT.firebaseapp.com",

  projectId:
    "DEIN_PROJECT",

  storageBucket:
    "DEIN_PROJECT.appspot.com",

  messagingSenderId:
    "123456789",

  appId:
    "DEINE_APP_ID"
};

// ========================================
// Firebase starten
// ========================================

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

// ========================================
// Karte
// ========================================

const map =
  L.map('map')
  .setView([51.505, -0.09], 13);

// ========================================
// OSM
// ========================================

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution:
      '&copy; OpenStreetMap contributors'
  }
).addTo(map);

// ========================================
// Marker
// ========================================

const marker =
  L.marker([51.505, -0.09])
  .addTo(map);

// ========================================
// Route Linie
// ========================================

let routeLine =
  L.polyline([], {
    color: 'blue'
  }).addTo(map);

// ========================================
// Variablen
// ========================================

let currentLat = null;

let currentLng = null;

let tracking = false;

let routePoints = [];

let totalDistance = 0;

let startTime = null;

let lastLat = null;

let lastLng = null;

// ========================================
// Distanz berechnen
// ========================================

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const dLat =
    (lat2-lat1)
    * Math.PI / 180;

  const dLon =
    (lon2-lon1)
    * Math.PI / 180;

  const a =

    Math.sin(dLat/2)
    * Math.sin(dLat/2)

    +

    Math.cos(lat1*Math.PI/180)
    *
    Math.cos(lat2*Math.PI/180)

    *

    Math.sin(dLon/2)
    *
    Math.sin(dLon/2);

  const c =

    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

  return R * c;
}

// ========================================
// GPS
// ========================================

navigator.geolocation.watchPosition(

  async (position) => {

    const lat =
      position.coords.latitude;

    const lng =
      position.coords.longitude;

    currentLat = lat;

    currentLng = lng;

    marker.setLatLng([lat, lng]);

    // Erstes Zentrieren

    if (!window.firstCenter) {

      map.setView([lat, lng], 17);

      window.firstCenter = true;
    }

    // Geschwindigkeit

    const speed =
      position.coords.speed || 0;

    const kmh =
      speed * 3.6;

    // Tracking

    if (tracking) {

      routePoints.push(
        [lat, lng]
      );

      routeLine.setLatLngs(
        routePoints
      );

      // Strecke

      if (
        lastLat !== null
      ) {

        totalDistance +=
          distanceMeters(
            lastLat,
            lastLng,
            lat,
            lng
          );
      }

      lastLat = lat;
      lastLng = lng;
    }

    // Fahrzeit

    let duration =
      "00:00:00";

    if (startTime) {

      const sec =
        Math.floor(
          (Date.now() - startTime)
          / 1000
        );

      const h =
        String(
          Math.floor(sec / 3600)
        ).padStart(2, '0');

      const m =
        String(
          Math.floor(
            (sec % 3600) / 60
          )
        ).padStart(2, '0');

      const s =
        String(
          sec % 60
        ).padStart(2, '0');

      duration =
        `${h}:${m}:${s}`;
    }

    // Anzeige

    document.getElementById(
      "stats"
    ).innerHTML = `

      Geschwindigkeit:
      ${kmh.toFixed(1)} km/h<br><br>

      Strecke:
      ${(totalDistance/1000).toFixed(2)} km<br><br>

      Fahrzeit:
      ${duration}

    `;
  },

  (err) => {

    console.error(err);
  },

  {
    enableHighAccuracy: true
  }
);

// ========================================
// Tracking
// ========================================

window.toggleTracking =
async function () {

  tracking = !tracking;

  const btn =
    document.getElementById(
      "trackingButton"
    );

  // START

  if (tracking) {

    routePoints = [];

    totalDistance = 0;

    startTime = Date.now();

    lastLat = null;
    lastLng = null;

    btn.innerText =
      "Tracking stoppen";
  }

  // STOP

  else {

    btn.innerText =
      "Tracking starten";

    // Name

    const routeName =
      prompt(
        "Name der Route:"
      );

    // Datum

    const date =
      new Date()
      .toLocaleDateString();

    // Fahrzeit

    const sec =
      Math.floor(
        (Date.now() - startTime)
        / 1000
      );

    const h =
      String(
        Math.floor(sec / 3600)
      ).padStart(2, '0');

    const m =
      String(
        Math.floor(
          (sec % 3600) / 60
        )
      ).padStart(2, '0');

    const s =
      String(
        sec % 60
      ).padStart(2, '0');

    const duration =
      `${h}:${m}:${s}`;

    // Firebase speichern

    await addDoc(

      collection(db, "routes"),

      {

        name:
          routeName || "Route",

        date: date,

        distance:
          (
            totalDistance / 1000
          ).toFixed(2),

        duration:
          duration,

        points:
          routePoints,

        created:
          new Date()
      }
    );

    alert(
      "Route gespeichert"
    );
  }
};

// ========================================
// Menü öffnen
// ========================================

window.openMenu =
function () {

  window.location.replace(
    "menu.html"
  );
};

// ========================================
// Zentrieren
// ========================================

window.centerMap =
function () {

  if (
    currentLat &&
    currentLng
  ) {

    map.setView(
      [currentLat, currentLng],
      17
    );
  }
};

// ========================================
// Route anzeigen
// ========================================

const selectedRouteId =
  localStorage.getItem(
    "selectedRouteId"
  );

if (selectedRouteId) {

  const routeDoc =
    await getDoc(

      doc(
        db,
        "routes",
        selectedRouteId
      )
    );

  if (routeDoc.exists()) {

    const route =
      routeDoc.data();

    routeLine.setLatLngs(
      route.points
    );

    map.fitBounds(
      routeLine.getBounds()
    );
  }

  localStorage.removeItem(
    "selectedRouteId"
  );
}

</script>

</body>
</html>
