<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>GPS Map V2</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
#map { width:100%; height:100vh; }

#menuButton, #centerButton {
  position:fixed; top:10px; left:10px; z-index:9999;
  width:50px; height:50px; border:none; border-radius:10px;
  background:white; font-size:28px; box-shadow:0 0 10px rgba(0,0,0,0.3);
}
#centerButton { top:70px; font-size:24px; }

#trackingButton {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  z-index:9999; padding:14px 24px; border:none; border-radius:14px;
  background:#007aff; color:white; font-size:18px; box-shadow:0 0 10px rgba(0,0,0,0.3);
  opacity: 0.6;
  pointer-events: none;
  transition: all 0.3s;
}

#trackingButton.enabled {
  opacity: 1;
  pointer-events: auto;
}

#stats {
  position:fixed; top:10px; right:10px; z-index:9999;
  width:220px; background:white; padding:12px; border-radius:12px;
  font-size:14px; box-shadow:0 0 10px rgba(0,0,0,0.3);
  display: none;
  transition: opacity 0.4s;
}

#stats.active {
  display: block;
}
</style>
</head>
<body>

<button id="menuButton" onclick="openMenu()">☰</button>
<button id="centerButton" onclick="centerMap()">◎</button>
<button id="trackingButton">Warte auf GPS-Signal...</button>

<div id="stats">
Geschwindigkeit: 0 km/h<br><br>
Strecke: 0.00 km<br><br>
Fahrzeit: 00:00:00
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBg_-8LeU72a-mj_zNyezr4zlXtJoHxi9c",
  authDomain: "ras-gps-route.firebaseapp.com",
  projectId: "ras-gps-route",
  storageBucket: "ras-gps-route.firebasestorage.app",
  messagingSenderId: "200005558812",
  appId: "1:200005558812:web:a6a89a131a35aad57ab5d9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const map = L.map("map").setView([51.505, -0.09], 13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

const marker = L.marker([51.505, -0.09]).addTo(map);
let routeLine = L.polyline([], { color: "blue", weight: 5 }).addTo(map);

let currentLat = null, currentLng = null;
let tracking = false;
let routePoints = [];
let totalDistance = 0;
let startTime = null;
let lastLat = null, lastLng = null;
let gpsReady = false;

// Distanzberechnung
function distanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) + 
            Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// GPS Watch
navigator.geolocation.watchPosition((position) => {
  const lat = position.coords.latitude;
  const lng = position.coords.longitude;
  const speed = (position.coords.speed || 0) * 3.6;

  currentLat = lat;
  currentLng = lng;
  marker.setLatLng([lat, lng]);

  if (!window.firstCenter) {
    map.setView([lat, lng], 17);
    window.firstCenter = true;
  }

  // GPS bereit
  if (!gpsReady) {
    gpsReady = true;
    const btn = document.getElementById("trackingButton");
    btn.textContent = "Tracking starten";
    btn.classList.add("enabled");
  }

  if (tracking) {
    if (routePoints.length === 0) {
      routePoints = [[lat, lng]];
      routeLine.setLatLngs(routePoints);
      lastLat = lat;
      lastLng = lng;
    } else if (lastLat !== null) {
      const dist = distanceMeters(lastLat, lastLng, lat, lng);
      if (dist > 4) {
        totalDistance += dist;
        routePoints.push([lat, lng]);
        routeLine.setLatLngs(routePoints);
        lastLat = lat;
        lastLng = lng;
      }
    }
  }

  // Stats nur während Tracking aktualisieren
  if (tracking) {
    updateStats(speed);
  }
}, (error) => console.error(error), { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });

function updateStats(speed) {
  let duration = "00:00:00";
  if (startTime) {
    const sec = Math.floor((Date.now() - startTime) / 1000);
    const h = String(Math.floor(sec / 3600)).padStart(2, "0");
    const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
    const s = String(sec % 60).padStart(2, "0");
    duration = `${h}:${m}:${s}`;
  }

  document.getElementById("stats").innerHTML = `
    Geschwindigkeit: ${speed.toFixed(1)} km/h<br><br>
    Strecke: ${(totalDistance / 1000).toFixed(2)} km<br><br>
    Fahrzeit: ${duration}
  `;
}

// ========================================
// TRACKING
// ========================================
window.toggleTracking = async function () {
  if (!gpsReady) {
    alert("Bitte warte bis ein GPS-Signal empfangen wurde.");
    return;
  }

  const btn = document.getElementById("trackingButton");
  const statsBox = document.getElementById("stats");

  if (!tracking) {
    // START
    tracking = true;
    routePoints = [];
    totalDistance = 0;
    startTime = Date.now();
    lastLat = null;
    lastLng = null;
    routeLine.setLatLngs([]);

    btn.textContent = "Tracking stoppen";
    btn.style.background = "#ff3b30";
    statsBox.classList.add("active");
  } else {
    // STOP
    tracking = false;
    btn.textContent = "Tracking starten";
    btn.style.background = "#007aff";

    if (routePoints.length < 2) {
      statsBox.classList.remove("active");
      alert("Keine ausreichende Route aufgezeichnet.");
      return;
    }

    const routeName = prompt("Name der Route:", "Meine Route") || "Route";
    const date = new Date().toLocaleDateString();

    const sec = Math.floor((Date.now() - startTime) / 1000);
    const h = String(Math.floor(sec / 3600)).padStart(2, "0");
    const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
    const s = String(sec % 60).padStart(2, "0");
    const duration = `${h}:${m}:${s}`;

    const pointsForFirestore = routePoints.map(p => ({ lat: p[0], lng: p[1] }));

    try {
      await addDoc(collection(db, "routes"), {
        name: routeName,
        date: date,
        distance: (totalDistance / 1000).toFixed(2),
        duration: duration,
        points: pointsForFirestore,
        created: Date.now()
      });
      alert(`✅ Route "${routeName}" gespeichert!\n${routePoints.length} Punkte • ${(totalDistance/1000).toFixed(2)} km`);
    } catch (e) {
      console.error(e);
      alert("Speicherfehler: " + (e.message || e.code));
    }

    // Stats 5 Sekunden lang sichtbar lassen
    setTimeout(() => {
      statsBox.classList.remove("active");
    }, 5000);
  }
};

window.openMenu = () => location.replace("menu.html");
window.centerMap = () => currentLat && currentLng && map.setView([currentLat, currentLng], 17);

// Geladene Route anzeigen
const selectedRouteId = localStorage.getItem("selectedRouteId");
if (selectedRouteId) {
  try {
    const routeDoc = await getDoc(doc(db, "routes", selectedRouteId));
    if (routeDoc.exists()) {
      const route = routeDoc.data();
      const points = route.points.map(p => Array.isArray(p) ? [p[0], p[1]] : [p.lat, p.lng]);
      routeLine.setLatLngs(points);
      L.marker(points[0]).addTo(map);
      L.marker(points[points.length-1]).addTo(map);
      map.fitBounds(routeLine.getBounds());
    }
  } catch (e) { console.error(e); }
  localStorage.removeItem("selectedRouteId");
}

</script>
</body>
</html>
