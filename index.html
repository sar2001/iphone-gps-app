<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>GPS App V2</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<style>

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  font-family: Arial, sans-serif;

  overflow: hidden;

  background: #f2f2f2;
}

/* STARTSEITE */

#home {

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  padding: 20px;

  box-sizing: border-box;
}

/* KARTE */

#map {

  width: 100%;
  height: 100vh;

  display: none;
}

/* TITEL */

h1 {

  margin-bottom: 40px;
}

/* GPS STATUS */

#gpsStatus {

  width: 90%;

  max-width: 420px;

  background: white;

  padding: 20px;

  border-radius: 16px;

  text-align: center;

  box-shadow:
    0 0 10px rgba(0,0,0,0.2);

  margin-bottom: 20px;

  font-size: 18px;

  line-height: 1.6;
}

/* SIGNAL */

#signal {

  font-size: 26px;

  margin-bottom: 10px;
}

/* BUTTONS */

button {

  width: 90%;

  max-width: 420px;

  padding: 16px;

  margin-top: 15px;

  border: none;

  border-radius: 14px;

  background: #007aff;

  color: white;

  font-size: 18px;
}

/* DISABLED */

button:disabled {

  background: #999;
}

/* ZURÜCK */

#backButton {

  position: fixed;

  top: 10px;
  left: 10px;

  z-index: 9999;

  width: 50px;
  height: 50px;

  border-radius: 10px;

  font-size: 24px;

  display: none;
}

/* GPS INFO */

#gpsInfo {

  margin-top: 15px;

  font-size: 16px;
}

</style>

</head>

<body>

<!-- START -->

<div id="home">

  <h1>
    GPS App V2
  </h1>

  <div id="gpsStatus">

    <div id="signal">

      📡

    </div>

    GPS wird gesucht...

    <div id="gpsInfo">

    </div>

  </div>

  <button
    id="mapButton"
    onclick="showMap()"
    disabled
  >

    Aktuelle Position anzeigen

  </button>

</div>

<!-- ZURÜCK -->

<button
  id="backButton"
  onclick="showHome()"
>
←
</button>

<!-- KARTE -->

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ========================================
// VARIABLEN
// ========================================

let currentLat = null;
let currentLng = null;

let accuracy = null;

let map;
let marker;

let firstFix = false;

// ========================================
// GPS STATUS
// ========================================

const gpsStatus =
  document.getElementById(
    "gpsStatus"
  );

const gpsInfo =
  document.getElementById(
    "gpsInfo"
  );

const signal =
  document.getElementById(
    "signal"
  );

// ========================================
// GPS NICHT VERFÜGBAR
// ========================================

if (!navigator.geolocation) {

  gpsStatus.innerHTML =

    "❌ GPS nicht unterstützt";
}

// ========================================
// GPS START
// ========================================

else {

  navigator.geolocation.watchPosition(

    (position) => {

      currentLat =
        position.coords.latitude;

      currentLng =
        position.coords.longitude;

      accuracy =
        Math.round(
          position.coords.accuracy
        );

      // ====================================
      // SIGNAL QUALITÄT
      // ====================================

      let quality = "";
      let color = "";

      if (accuracy <= 10) {

        quality =
          "Sehr gut";

        color =
          "green";

        signal.innerHTML =
          "🟢";
      }

      else if (accuracy <= 30) {

        quality =
          "Gut";

        color =
          "orange";

        signal.innerHTML =
          "🟠";
      }

      else {

        quality =
          "Schlecht";

        color =
          "red";

        signal.innerHTML =
          "🔴";
      }

      // ====================================
      // STATUS
      // ====================================

      gpsStatus.innerHTML = `

        <div id="signal">

          ${signal.innerHTML}

        </div>

        <b style="
          color:${color};
        ">

          GPS ${quality}

        </b>

        <div id="gpsInfo">

          <br>

          Breitengrad:
          ${currentLat.toFixed(6)}

          <br><br>

          Längengrad:
          ${currentLng.toFixed(6)}

          <br><br>

          Genauigkeit:
          ${accuracy} m

        </div>
      `;

      // ====================================
      // BUTTON AKTIV
      // ====================================

      document.getElementById(
        "mapButton"
      ).disabled = false;

      // ====================================
      // ERSTES GPS FIX
      // ====================================

      if (!firstFix) {

        firstFix = true;

        console.log(
          "GPS bereit"
        );
      }

      // ====================================
      // KARTE LIVE AKTUALISIEREN
      // ====================================

      if (map && marker) {

        marker.setLatLng(
          [currentLat, currentLng]
        );
      }
    },

    (error) => {

      gpsStatus.innerHTML =

        "❌ GPS Fehler";

      console.error(error);
    },

    {

      enableHighAccuracy: true,

      timeout: 30000,

      maximumAge: 0
    }
  );
}

// ========================================
// KARTE ZEIGEN
// ========================================

window.showMap =
function () {

  document.getElementById(
    "home"
  ).style.display = "none";

  document.getElementById(
    "map"
  ).style.display = "block";

  document.getElementById(
    "backButton"
  ).style.display = "block";

  // ====================================
  // KARTE ERZEUGEN
  // ====================================

  if (!map) {

    map =
      L.map("map")
      .setView(
        [currentLat, currentLng],
        18
      );

    L.tileLayer(

      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

      {

        attribution:
          "&copy; OpenStreetMap contributors"
      }

    ).addTo(map);

    marker =
      L.marker(
        [currentLat, currentLng]
      ).addTo(map);

    marker.bindPopup(

      "Aktuelle Position"

    ).openPopup();
  }

  // ====================================
  // POSITION AKTUALISIEREN
  // ====================================

  else {

    map.setView(
      [currentLat, currentLng],
      18
    );

    marker.setLatLng(
      [currentLat, currentLng]
    );
  }

  // ====================================
  // LEAFLET FIX
  // ====================================

  setTimeout(() => {

    map.invalidateSize();

  }, 300);
};

// ========================================
// ZURÜCK
// ========================================

window.showHome =
function () {

  document.getElementById(
    "home"
  ).style.display = "flex";

  document.getElementById(
    "map"
  ).style.display = "none";

  document.getElementById(
    "backButton"
  ).style.display = "none";
};

</script>

</body>
</html>
