<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GPS App V2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#007aff"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>

<style>
html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  font-family: Arial, sans-serif;
  overflow: hidden;
  background: #f2f2f2;
}

/* ... restliche Styles bleiben gleich ... */

button {
  width: 90%;
  max-width: 420px;
  padding: 16px;
  margin-top: 15px;
  border: none;
  border-radius: 14px;
  background: #007aff;
  color: white;
  font-size: 18px;
}

button.secondary {
  background: #585858;
}

button:disabled {
  background: #999;
}
</style>
</head>

<body>

<div id="home">
  <h1>GPS App V2</h1>

  <div id="gpsStatus">
    <div id="signal">📡</div>
    GPS wird gesucht...
    <div id="gpsInfo"></div>
  </div>

  <button id="mapButton" onclick="showMap()" disabled>
    Aktuelle Position anzeigen
  </button>

  <!-- NEUER BUTTON -->
  <button id="restartButton" onclick="restartGPS()">
    🔄 GPS-Suche neu starten
  </button>
</div>

<button id="backButton" onclick="showHome()">←</button>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>

// ========================================
// VARIABLEN
// ========================================

let currentLat = null;
let currentLng = null;
let accuracy = null;

let map;
let marker;
let firstFix = false;
let watchId = null;                    // ← NEU

// ... (gpsStatus, gpsInfo, signal) ...

// ========================================
// GPS START / RESTART
// ========================================

function startGPS() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
  }

  watchId = navigator.geolocation.watchPosition(
    (position) => {
      // ... (bestehende Position-Handler bleibt unverändert) ...
      currentLat = position.coords.latitude;
      currentLng = position.coords.longitude;
      accuracy = Math.round(position.coords.accuracy);

      // Signal-Qualität + Status Update (unverändert)
      let quality = "";
      let color = "";

      if (accuracy <= 10) {
        quality = "Sehr gut"; color = "green"; signal.innerHTML = "🟢";
      } else if (accuracy <= 30) {
        quality = "Gut"; color = "orange"; signal.innerHTML = "🟠";
      } else {
        quality = "Schlecht"; color = "red"; signal.innerHTML = "🔴";
      }

      gpsStatus.innerHTML = `
        <div id="signal">${signal.innerHTML}</div>
        <b style="color:${color}">GPS ${quality}</b>
        <div id="gpsInfo">
          <br>
          Breitengrad: ${currentLat.toFixed(6)}<br><br>
          Längengrad: ${currentLng.toFixed(6)}<br><br>
          Genauigkeit: ${accuracy} m
        </div>
      `;

      document.getElementById("mapButton").disabled = false;

      if (!firstFix) {
        firstFix = true;
        console.log("GPS bereit");
      }

      if (map && marker) {
        marker.setLatLng([currentLat, currentLng]);
      }
    },

    (error) => {
      let msg = "❌ GPS Fehler";
      if (error.code === error.PERMISSION_DENIED) msg = "❌ Standortzugriff verweigert";
      if (error.code === error.POSITION_UNAVAILABLE) msg = "❌ Kein GPS-Signal";
      if (error.code === error.TIMEOUT) msg = "⏱️ Zeitüberschreitung";

      gpsStatus.innerHTML = msg;
      console.error(error);
    },

    {
      enableHighAccuracy: true,
      timeout: 30000,
      maximumAge: 0
    }
  );
}

// Initial starten
if (navigator.geolocation) {
  startGPS();
} else {
  gpsStatus.innerHTML = "❌ GPS nicht unterstützt";
}

// ========================================
// NEUE FUNKTION: GPS NEU STARTEN
// ========================================

window.restartGPS = function() {
  const btn = document.getElementById("restartButton");
  btn.textContent = "🔄 Neustart...";
  btn.disabled = true;

  // Status zurücksetzen
  gpsStatus.innerHTML = `
    <div id="signal">📡</div>
    GPS wird neu gesucht...
    <div id="gpsInfo"></div>
  `;

  // Neustart
  startGPS();

  // Button nach 3 Sekunden wieder aktivieren
  setTimeout(() => {
    btn.textContent = "🔄 GPS-Suche neu starten";
    btn.disabled = false;
  }, 3000);
};

// Die restlichen Funktionen (showMap, showHome) bleiben gleich...

</script>
</body>
</html>
