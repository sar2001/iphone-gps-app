<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Motorrad GPS Tracker</title>

  <!-- Leaflet -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>

    html, body {

      margin: 0;
      padding: 0;

      height: 100%;

      font-family: Arial, sans-serif;
    }

    #map {

      width: 100%;
      height: 100vh;
    }

    /* -------------------------------- */
    /* SIDE PANEL */
    /* -------------------------------- */

    .side-panel {

      position: fixed;

      top: 0;
      left: -340px;

      width: 320px;
      height: 100%;

      background: white;

      z-index: 2000;

      padding: 16px;

      box-shadow: 2px 0 10px rgba(0,0,0,0.3);

      transition: left 0.3s ease;

      overflow-y: auto;
    }

    .side-panel.open {

      left: 0;
    }

    /* -------------------------------- */
    /* MENU BUTTON */
    /* -------------------------------- */

    #menuButton {

      position: fixed;

      top: 10px;
      left: 10px;

      z-index: 3000;

      width: 50px;
      height: 50px;

      border: none;

      border-radius: 10px;

      background: white;

      font-size: 28px;

      box-shadow: 0 0 10px rgba(0,0,0,0.3);

      cursor: pointer;
    }

    /* -------------------------------- */
    /* CENTER BUTTON */
    /* -------------------------------- */

    #centerButton {

      position: fixed;

      top: 70px;
      left: 10px;

      z-index: 3000;

      width: 50px;
      height: 50px;

      border: none;

      border-radius: 10px;

      background: white;

      font-size: 24px;

      box-shadow: 0 0 10px rgba(0,0,0,0.3);

      cursor: pointer;
    }

    /* -------------------------------- */
    /* BUTTONS */
    /* -------------------------------- */

    button {

      width: 100%;

      padding: 12px;

      margin-top: 8px;

      font-size: 16px;

      cursor: pointer;
    }

    h3, h4 {

      margin-top: 0;
    }

    /* -------------------------------- */
    /* ROUTE ITEMS */
    /* -------------------------------- */

    .routeItem {

      border: 1px solid #ccc;

      border-radius: 10px;

      padding: 10px;

      margin-top: 10px;
    }

  </style>
</head>

<body>

<!-- -------------------------------- -->
<!-- SIDE PANEL -->
<!-- -------------------------------- -->

<div id="sidePanel" class="side-panel">

  <h3 id="appTitle"></h3>

  <div id="status">
    Warte auf Standort...
  </div>

  <!-- Neue Route -->

  <button
    id="newRouteBtn"
    onclick="createNewRoute()"
  >
    Neue Route
  </button>

  <!-- Tracking starten -->

  <button
    id="startTrackingBtn"
    onclick="enableRouteTracking()"
    style="display:none;"
  >
    Tracking starten
  </button>

  <!-- Tracking stoppen -->

  <button
    id="stopTrackingBtn"
    onclick="stopRouteTracking()"
    style="display:none;"
  >
    Tracking stoppen
  </button>

  <!-- Route löschen -->

  <button
    id="clearRouteBtn"
    onclick="clearRoute()"
    style="display:none;"
  >
    Route löschen
  </button>

  <hr>

  <!-- Cloud Routen -->

  <h4>Cloud Routen</h4>

  <div id="savedRoutesList">
    Lade Routen...
  </div>

</div>

<!-- -------------------------------- -->
<!-- MENU -->
<!-- -------------------------------- -->

<button
  id="menuButton"
  onclick="togglePanel()"
>
☰
</button>

<!-- -------------------------------- -->
<!-- CENTER -->
<!-- -------------------------------- -->

<button
  id="centerButton"
  onclick="centerMap()"
>
◎
</button>

<!-- -------------------------------- -->
<!-- MAP -->
<!-- -------------------------------- -->

<div id="map"></div>

<!-- -------------------------------- -->
<!-- Leaflet -->
<!-- -------------------------------- -->

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- -------------------------------- -->
<!-- Firebase -->
<!-- -------------------------------- -->

<script type="module">

// ------------------------------------
// Firebase Imports
// ------------------------------------

import {

  initializeApp

} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

  getFirestore,
  collection,
  addDoc,
  getDocs,

  doc,
  getDoc,
  deleteDoc

} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ------------------------------------
// FIREBASE CONFIG
// ------------------------------------

const firebaseConfig = {

  apiKey:
    "AIzaSyBG-_8LeU72a-mj-zNyezr4zlXtJoHxi9c",

  authDomain:
    "ras-gps-route.firebaseapp.com",

  projectId:
    "ras-gps-route",

  storageBucket:
    "ras-gps-route.firebasestorage.app",

  messagingSenderId:
    "200005558812",

  appId:
    "1:200005558812:web:a6a89a131a35aad57ab5d9"
};

// ------------------------------------
// Firebase starten
// ------------------------------------

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

// ------------------------------------
// VERSION
// ------------------------------------

const APP_VERSION =
  document.lastModified;

document.getElementById(
  "appTitle"
).innerText =
  `Motorrad GPS Tracker ${APP_VERSION}`;

// ------------------------------------
// Variablen
// ------------------------------------

let map;

let marker;

let circle;

let watchId;

let trackingActive = false;

let routeCoordinates = [];

let routeLine;

let currentLat = null;

let currentLng = null;

let routeName = "";

let routeDate = "";

// Motorrad Einstellungen

const minDistance = 15;
const maxSeconds = 5;

let lastSavedLat = null;
let lastSavedLng = null;

let lastSaveTime = 0;

// Statistik

let totalDistance = 0;

let startTime = null;

let currentSpeed = 0;

// ------------------------------------
// Karte
// ------------------------------------

map = L.map('map')
.setView([51.505, -0.09], 13);

// ------------------------------------
// OpenStreetMap
// ------------------------------------

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution:
      '&copy; OpenStreetMap contributors'
  }
).addTo(map);

// ------------------------------------
// Marker
// ------------------------------------

marker =
  L.marker([51.505, -0.09])
  .addTo(map);

// ------------------------------------
// Genauigkeitskreis
// ------------------------------------

circle =
  L.circle([51.505, -0.09], {
    radius: 50
  }).addTo(map);

// ------------------------------------
// GPS sofort starten
// ------------------------------------

startLocationUpdates(false);

// ------------------------------------
// Cloud Routen laden
// ------------------------------------

loadRoutes();

// ------------------------------------
// Entfernung berechnen
// ------------------------------------

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const dLat =
    (lat2 - lat1)
    * Math.PI / 180;

  const dLon =
    (lon2 - lon1)
    * Math.PI / 180;

  const a =

    Math.sin(dLat/2)
    * Math.sin(dLat/2)

    +

    Math.cos(lat1*Math.PI/180)
    *
    Math.cos(lat2*Math.PI/180)

    *

    Math.sin(dLon/2)
    *
    Math.sin(dLon/2);

  const c =

    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

  return R * c;
}

// ------------------------------------
// GPS Funktion
// ------------------------------------

function startLocationUpdates(
  saveRoute = false
) {

  if (!navigator.geolocation) {

    alert(
      "Geolocation nicht unterstützt"
    );

    return;
  }

  watchId =
    navigator.geolocation.watchPosition(

      async (position) => {

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;

        const accuracy =
          position.coords.accuracy;

        currentLat = lat;
        currentLng = lng;

        // Geschwindigkeit

        currentSpeed =
          position.coords.speed || 0;

        const kmh =
          currentSpeed * 3.6;

        // Marker

        marker.setLatLng([lat, lng]);

        // Kreis

        circle.setLatLng([lat, lng]);

        circle.setRadius(accuracy);

        // Popup

        marker.bindPopup(`
          <b>Du bist hier</b><br>
          Genauigkeit:
          ${Math.round(accuracy)} m
        `);

        // Erste Zentrierung

        if (!window.initialCentered) {

          map.setView([lat, lng], 17);

          window.initialCentered = true;
        }

        // --------------------------------
        // Motorrad Tracking
        // --------------------------------

        if (
          saveRoute &&
          trackingActive
        ) {

          const now =
            Date.now();

          let shouldSave =
            false;

          // Erster Punkt

          if (
            lastSavedLat === null
          ) {

            shouldSave = true;
          }

          else {

            const dist =
              distanceMeters(
                lastSavedLat,
                lastSavedLng,
                lat,
                lng
              );

            const seconds =
              (
                now -
                lastSaveTime
              ) / 1000;

            if (
              dist >= minDistance
              ||
              seconds >= maxSeconds
            ) {

              shouldSave = true;
            }
          }

          // Speichern

          if (shouldSave) {

            // Distanz

            if (
              lastSavedLat !== null
            ) {

              const dist =
                distanceMeters(
                  lastSavedLat,
                  lastSavedLng,
                  lat,
                  lng
                );

              totalDistance += dist;
            }

            routeCoordinates.push(
              [lat, lng]
            );

            lastSavedLat = lat;
            lastSavedLng = lng;

            lastSaveTime = now;

            // Linie aktualisieren

            if (routeLine) {

              map.removeLayer(
                routeLine
              );
            }

            routeLine =
              L.polyline(
                routeCoordinates,
                {
                  color: 'blue'
                }
              ).addTo(map);
          }
        }

        // --------------------------------
        // Fahrzeit
        // --------------------------------

        let durationText = "-";

        if (startTime) {

          const durationMs =
            Date.now() - startTime;

          const totalSeconds =
            Math.floor(
              durationMs / 1000
            );

          const hours =
            Math.floor(
              totalSeconds / 3600
            );

          const minutes =
            Math.floor(
              (totalSeconds % 3600)
              / 60
            );

          const seconds =
            totalSeconds % 60;

          durationText =

            String(hours)
            .padStart(2, '0')

            + ":"

            +

            String(minutes)
            .padStart(2, '0')

            + ":"

            +

            String(seconds)
            .padStart(2, '0');
        }

        // --------------------------------
        // Adresse holen
        // --------------------------------

        let address =
          "Adresse unbekannt";

        try {

          const response =
            await fetch(
              `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`
            );

          const data =
            await response.json();

          if (data.display_name) {

            address =
              data.display_name;
          }

        } catch (err) {

          console.error(err);
        }

        // --------------------------------
        // Status
        // --------------------------------

        document.getElementById(
          "status"
        ).innerHTML = `

          <b>Route:</b><br>
          ${routeName || "Keine"}<br><br>

          <b>Datum:</b><br>
          ${routeDate || "-"}<br><br>

          <b>Breitengrad:</b><br>
          ${lat.toFixed(6)}<br><br>

          <b>Längengrad:</b><br>
          ${lng.toFixed(6)}<br><br>

          <b>Genauigkeit:</b><br>
          ${Math.round(accuracy)} m<br><br>

          <b>Adresse:</b><br>
          ${address}<br><br>

          <b>Geschwindigkeit:</b><br>
          ${kmh.toFixed(1)} km/h<br><br>

          <b>Strecke:</b><br>
          ${(totalDistance / 1000).toFixed(2)} km<br><br>

          <b>Fahrzeit:</b><br>
          ${durationText}<br><br>

          <b>Tracking aktiv:</b><br>
          ${trackingActive ? "JA" : "NEIN"}<br><br>

          <b>Punkte:</b><br>
          ${routeCoordinates.length}

        `;
      },

      (error) => {

        console.error(error);

        alert("GPS Fehler");
      },

      {
        enableHighAccuracy: true,

        timeout: 10000,

        maximumAge: 1000
      }
    );
}

// ------------------------------------
// Neue Route
// ------------------------------------

window.createNewRoute =
function () {

  routeName =
    prompt(
      "Name der Route:"
    );

  if (!routeName) {

    return;
  }

  const today =
    new Date()
    .toLocaleDateString();

  routeDate =
    prompt(
      "Datum:",
      today
    );

  if (!routeDate) {

    routeDate = today;
  }

  routeCoordinates = [];

  totalDistance = 0;

  startTime = null;

  lastSavedLat = null;
  lastSavedLng = null;
  lastSaveTime = 0;

  if (routeLine) {

    map.removeLayer(routeLine);
  }

  document.getElementById(
    "startTrackingBtn"
  ).style.display = "block";

  document.getElementById(
    "clearRouteBtn"
  ).style.display = "block";

  document.getElementById(
    "stopTrackingBtn"
  ).style.display = "none";

  alert(
    "Neue Route erstellt"
  );
};

// ------------------------------------
// Tracking starten
// ------------------------------------

window.enableRouteTracking =
function () {

  trackingActive = true;

  startTime = Date.now();

  document.getElementById(
    "startTrackingBtn"
  ).style.display = "none";

  document.getElementById(
    "stopTrackingBtn"
  ).style.display = "block";

  if (watchId) {

    navigator.geolocation
    .clearWatch(watchId);
  }

  startLocationUpdates(true);

  alert(
    "Tracking gestartet"
  );
};

// ------------------------------------
// Tracking stoppen
// ------------------------------------

window.stopRouteTracking =
async function () {

  trackingActive = false;

  let durationText = "-";

  if (startTime) {

    const durationMs =
      Date.now() - startTime;

    const totalSeconds =
      Math.floor(
        durationMs / 1000
      );

    const hours =
      Math.floor(
        totalSeconds / 3600
      );

    const minutes =
      Math.floor(
        (totalSeconds % 3600)
        / 60
      );

    const seconds =
      totalSeconds % 60;

    durationText =

      String(hours)
      .padStart(2, '0')

      + ":"

      +

      String(minutes)
      .padStart(2, '0')

      + ":"

      +

      String(seconds)
      .padStart(2, '0');
  }

  try {

    await addDoc(

      collection(db, "routes"),

      {
        name: routeName,

        date: routeDate,

        points: routeCoordinates,

        distanceKm:
          (
            totalDistance / 1000
          ).toFixed(2),

        duration:
          durationText,

        created:
          new Date()
      }
    );

  } catch (err) {

    console.error(err);

    alert(err);
  }

  loadRoutes();

  document.getElementById(
    "startTrackingBtn"
  ).style.display = "none";

  document.getElementById(
    "stopTrackingBtn"
  ).style.display = "none";

  alert(
    "Route gespeichert"
  );
};

// ------------------------------------
// Cloud Routen laden
// ------------------------------------

async function loadRoutes() {

  const list =
    document.getElementById(
      "savedRoutesList"
    );

  list.innerHTML = "";

  const querySnapshot =
    await getDocs(
      collection(db, "routes")
    );

  querySnapshot.forEach((docSnap) => {

    const route =
      docSnap.data();

    const docId =
      docSnap.id;

    list.innerHTML += `

      <div class="routeItem">

        <b>${route.name}</b><br>

        ${route.date}<br>

        Strecke:
        ${route.distanceKm || 0} km<br>

        Fahrzeit:
        ${route.duration || "-"}<br>

        Punkte:
        ${route.points.length}<br><br>

        <button
          onclick="showRoute('${docId}')"
        >
          Route anzeigen
        </button>

        <button
          onclick="deleteRoute('${docId}')"
        >
          Route löschen
        </button>

      </div>
    `;
  });

  if (list.innerHTML === "") {

    list.innerHTML =
      "Keine Routen";
  }
}

// ------------------------------------
// Route anzeigen
// ------------------------------------

window.showRoute =
async function (docId) {

  const routeDoc =
    await getDoc(
      doc(db, "routes", docId)
    );

  if (!routeDoc.exists()) {

    alert("Route nicht gefunden");

    return;
  }

  const route =
    routeDoc.data();

  if (routeLine) {

    map.removeLayer(routeLine);
  }

  routeLine =
    L.polyline(
      route.points,
      {
        color: 'red',
        weight: 5
      }
    ).addTo(map);

  map.fitBounds(
    routeLine.getBounds()
  );

  document
    .getElementById("sidePanel")
    .classList.remove("open");
};

// ------------------------------------
// Route löschen
// ------------------------------------

window.deleteRoute =
async function (docId) {

  const ok =
    confirm(
      "Route wirklich löschen?"
    );

  if (!ok) {

    return;
  }

  await deleteDoc(
    doc(db, "routes", docId)
  );

  loadRoutes();

  alert(
    "Route gelöscht"
  );
};

// ------------------------------------
// Route löschen lokal
// ------------------------------------

window.clearRoute =
function () {

  routeCoordinates = [];

  routeName = "";

  routeDate = "";

  totalDistance = 0;

  startTime = null;

  if (routeLine) {

    map.removeLayer(routeLine);
  }

  document.getElementById(
    "startTrackingBtn"
  ).style.display = "none";

  document.getElementById(
    "stopTrackingBtn"
  ).style.display = "none";

  document.getElementById(
    "clearRouteBtn"
  ).style.display = "none";

  alert(
    "Route gelöscht"
  );
};

// ------------------------------------
// Menü
// ------------------------------------

window.togglePanel =
function () {

  document
    .getElementById("sidePanel")
    .classList.toggle("open");
};

// ------------------------------------
// Karte zentrieren
// ------------------------------------

window.centerMap =
function () {

  if (
    currentLat &&
    currentLng
  ) {

    map.setView(
      [currentLat, currentLng],
      17
    );
  }
};

// ------------------------------------
// Swipe
// ------------------------------------

let touchStartX = 0;

document.addEventListener(
  "touchstart",
  (e) => {

    touchStartX =
      e.changedTouches[0].screenX;
  }
);

document.addEventListener(
  "touchend",
  (e) => {

    const touchEndX =
      e.changedTouches[0].screenX;

    // Öffnen

    if (
      touchEndX - touchStartX > 80
    ) {

      document
        .getElementById(
          "sidePanel"
        )
        .classList.add("open");
    }

    // Schließen

    if (
      touchStartX - touchEndX > 80
    ) {

      document
        .getElementById(
          "sidePanel"
        )
        .classList.remove("open");
    }
  }
);

</script>

</body>
</html>
