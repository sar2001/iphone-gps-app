<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>iPhone GPS Tracker</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>

    html, body {

      margin: 0;
      padding: 0;

      height: 100%;

      font-family: Arial, sans-serif;
    }

    #map {

      width: 100%;
      height: 100vh;
    }

    /* ------------------------------------ */
    /* Side Panel */
    /* ------------------------------------ */

    .side-panel {

      position: fixed;

      top: 0;
      left: -340px;

      width: 320px;
      height: 100%;

      background: white;

      z-index: 2000;

      padding: 16px;

      box-shadow: 2px 0 10px rgba(0,0,0,0.3);

      transition: left 0.3s ease;

      overflow-y: auto;
    }

    .side-panel.open {

      left: 0;
    }

    /* ------------------------------------ */
    /* Menü Button */
    /* ------------------------------------ */

    #menuButton {

      position: fixed;

      top: 10px;
      left: 10px;

      z-index: 3000;

      width: 50px;
      height: 50px;

      border: none;

      border-radius: 10px;

      background: white;

      font-size: 28px;

      box-shadow: 0 0 10px rgba(0,0,0,0.3);

      cursor: pointer;
    }

    /* ------------------------------------ */
    /* Buttons */
    /* ------------------------------------ */

    button {

      width: 100%;

      padding: 12px;

      margin-top: 8px;

      font-size: 16px;

      cursor: pointer;
    }

    h3 {
      margin-top: 0;
    }

  </style>
</head>

<body>

<!-- ------------------------------------ -->
<!-- Side Panel -->
<!-- ------------------------------------ -->

<div id="sidePanel" class="side-panel">

  <h3 id="appTitle"></h3>

  <div id="status">
    Warte auf Standort...
  </div>

  <button onclick="enableRouteTracking()">
    Tracking starten
  </button>

  <button onclick="stopRouteTracking()">
    Tracking stoppen
  </button>

  <button onclick="clearRoute()">
    Route löschen
  </button>

</div>

<!-- ------------------------------------ -->
<!-- Menü Button -->
<!-- ------------------------------------ -->

<button id="menuButton" onclick="togglePanel()">
☰
</button>

<!-- ------------------------------------ -->
<!-- Karte -->
<!-- ------------------------------------ -->

<div id="map"></div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ------------------------------------
// AUTOMATISCHE VERSION
// ------------------------------------

const APP_VERSION = document.lastModified;

// ------------------------------------
// Titel setzen
// ------------------------------------

document.addEventListener("DOMContentLoaded", () => {

  document.getElementById("appTitle").innerText =
    `GPS Tracking ${APP_VERSION}`;
});

// ------------------------------------
// Variablen
// ------------------------------------

let map;

let marker;

let circle;

let watchId;

let trackingActive = false;

let routeCoordinates = [];

let routeLine;

// Aktuelle Position
let currentLat = null;
let currentLng = null;

// ------------------------------------
// Karte initialisieren
// ------------------------------------

map = L.map('map').setView([51.505, -0.09], 13);

// ------------------------------------
// OpenStreetMap Layer
// ------------------------------------

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '&copy; OpenStreetMap contributors'
  }
).addTo(map);

// ------------------------------------
// Marker
// ------------------------------------

marker = L.marker([51.505, -0.09]).addTo(map);

// ------------------------------------
// Genauigkeitskreis
// ------------------------------------

circle = L.circle([51.505, -0.09], {
  radius: 50
}).addTo(map);

// ------------------------------------
// Gespeicherte Route laden
// ------------------------------------

const savedRoute = localStorage.getItem("savedRoute");

if (savedRoute) {

  routeCoordinates = JSON.parse(savedRoute);

  routeLine = L.polyline(routeCoordinates).addTo(map);
}

// ------------------------------------
// GPS sofort starten
// Nur Anzeige
// ------------------------------------

startLocationUpdates(false);

// ------------------------------------
// GPS Funktion
// ------------------------------------

function startLocationUpdates(saveRoute = false) {

  if (!navigator.geolocation) {

    alert("Geolocation nicht unterstützt");

    return;
  }

  watchId = navigator.geolocation.watchPosition(

    async (position) => {

      const lat = position.coords.latitude;

      const lng = position.coords.longitude;

      const accuracy = position.coords.accuracy;

      // Aktuelle Position speichern
      currentLat = lat;
      currentLng = lng;

      // Marker aktualisieren
      marker.setLatLng([lat, lng]);

      // Kreis aktualisieren
      circle.setLatLng([lat, lng]);

      circle.setRadius(accuracy);

      // Karte zentrieren
      map.setView([lat, lng], 17);

      // Popup
      marker.bindPopup(`
        <b>Du bist hier</b><br>
        Genauigkeit: ${Math.round(accuracy)} m
      `).openPopup();

      // Route speichern
      if (saveRoute && trackingActive) {

        routeCoordinates.push([lat, lng]);

        localStorage.setItem(
          "savedRoute",
          JSON.stringify(routeCoordinates)
        );

        if (routeLine) {

          map.removeLayer(routeLine);
        }

        routeLine = L.polyline(routeCoordinates).addTo(map);
      }

      // Adresse holen
      let address = "Adresse unbekannt";

      try {

        const response = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`
        );

        const data = await response.json();

        if (data.display_name) {

          address = data.display_name;
        }

      } catch (err) {

        console.error(err);
      }

      // Status anzeigen
      document.getElementById("status").innerHTML = `

        <b>Breitengrad:</b><br>
        ${lat.toFixed(6)}<br><br>

        <b>Längengrad:</b><br>
        ${lng.toFixed(6)}<br><br>

        <b>Genauigkeit:</b><br>
        ${Math.round(accuracy)} m<br><br>

        <b>Aktuelle Adresse:</b><br>
        ${address}<br><br>

        <b>Tracking aktiv:</b><br>
        ${trackingActive ? "JA" : "NEIN"}<br><br>

        <b>Gespeicherte Punkte:</b><br>
        ${routeCoordinates.length}

      `;
    },

    (error) => {

      console.error(error);

      switch(error.code) {

        case error.PERMISSION_DENIED:

          alert("Standortzugriff verweigert");

          break;

        case error.POSITION_UNAVAILABLE:

          alert("Position nicht verfügbar");

          break;

        case error.TIMEOUT:

          alert("Zeitüberschreitung");

          break;

        default:

          alert("Unbekannter Fehler");
      }
    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}

// ------------------------------------
// Tracking STARTEN
// ------------------------------------

function enableRouteTracking() {

  trackingActive = true;

  if (watchId) {

    navigator.geolocation.clearWatch(watchId);
  }

  startLocationUpdates(true);

  alert("Routenaufzeichnung gestartet");
}

// ------------------------------------
// Tracking STOPPEN
// ------------------------------------

function stopRouteTracking() {

  trackingActive = false;

  if (watchId) {

    navigator.geolocation.clearWatch(watchId);
  }

  startLocationUpdates(false);

  alert("Routenaufzeichnung gestoppt");
}

// ------------------------------------
// Route löschen
// ------------------------------------

function clearRoute() {

  routeCoordinates = [];

  localStorage.removeItem("savedRoute");

  if (routeLine) {

    map.removeLayer(routeLine);
  }

  alert("Route gelöscht");
}

// ------------------------------------
// Side Panel öffnen/schließen
// ------------------------------------

function togglePanel() {

  const panel =
    document.getElementById("sidePanel");

  panel.classList.toggle("open");

  // Wenn Menü geschlossen wird:
  // auf aktuellen Standort zentrieren
  if (!panel.classList.contains("open")) {

    setTimeout(() => {

      if (currentLat && currentLng) {

        map.setView(
          [currentLat, currentLng],
          17
        );
      }

    }, 300);
  }
}

// ------------------------------------
// Swipe erkennen
// ------------------------------------

let touchStartX = 0;

document.addEventListener("touchstart", (e) => {

  touchStartX = e.changedTouches[0].screenX;
});

document.addEventListener("touchend", (e) => {

  const touchEndX = e.changedTouches[0].screenX;

  // Nach rechts wischen = öffnen
  if (touchEndX - touchStartX > 80) {

    document
      .getElementById("sidePanel")
      .classList.add("open");
  }

  // Nach links wischen = schließen
  if (touchStartX - touchEndX > 80) {

    document
      .getElementById("sidePanel")
      .classList.remove("open");

    // Nach Schließen auf Standort zentrieren
    setTimeout(() => {

      if (currentLat && currentLng) {

        map.setView(
          [currentLat, currentLng],
          17
        );
      }

    }, 300);
  }
});

</script>

</body>
</html>
