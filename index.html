<!DOCTYPE html>
<html lang="de">
<head>
<!-- ... Header bleibt gleich ... -->
</head>
<body>

<div id="home">
  <h1>GPS App V2</h1>

  <div id="gpsStatus">
    <div id="signal">📡</div>
    GPS wird gesucht...
    <div id="gpsInfo"></div>
  </div>

  <button id="mapButton" onclick="showMap()" disabled>
    Aktuelle Position anzeigen
  </button>

  <button id="restartButton" onclick="restartGPS()">
    🔄 GPS-Suche neu starten
  </button>
</div>

<!-- Rest bleibt gleich -->

<script>
// Neue Variablen
let watchId = null;
let lastPositions = [];           // Für Averaging
const MAX_POSITIONS = 5;

function startGPS() {
  if (watchId) navigator.geolocation.clearWatch(watchId);

  watchId = navigator.geolocation.watchPosition(
    (position) => {
      const acc = Math.round(position.coords.accuracy);

      // Filter: Nur gute Messungen akzeptieren
      if (acc > 100) return; // sehr schlechte Messungen ignorieren

      // Averaging (Durchschnitt der letzten guten Positionen)
      lastPositions.push({
        lat: position.coords.latitude,
        lng: position.coords.longitude,
        acc: acc
      });

      if (lastPositions.length > MAX_POSITIONS) lastPositions.shift();

      // Durchschnitt berechnen
      let avgLat = 0, avgLng = 0, avgAcc = 0;
      lastPositions.forEach(p => {
        avgLat += p.lat;
        avgLng += p.lng;
        avgAcc += p.acc;
      });
      avgLat /= lastPositions.length;
      avgLng /= lastPositions.length;
      avgAcc = Math.round(avgAcc / lastPositions.length);

      currentLat = avgLat;
      currentLng = avgLng;
      accuracy = avgAcc;

      // ... Signal-Qualität Logik ...

      // Erweiterte Anzeige
      gpsStatus.innerHTML = `
        <div id="signal">${signal.innerHTML}</div>
        <b style="color:${color}">GPS ${quality}</b>
        <div id="gpsInfo">
          <br>
          Breitengrad: ${currentLat.toFixed(6)}<br><br>
          Längengrad: ${currentLng.toFixed(6)}<br><br>
          Genauigkeit: ${accuracy} m<br><br>
          Höhe: ${position.coords.altitude ? position.coords.altitude.toFixed(1) + ' m' : '—'}<br>
          Geschwindigkeit: ${position.coords.speed ? (position.coords.speed * 3.6).toFixed(1) + ' km/h' : '—'}<br>
          Richtung: ${position.coords.heading ? position.coords.heading.toFixed(0) + '°' : '—'}
        </div>
      `;

      document.getElementById("mapButton").disabled = false;

      if (map && marker) marker.setLatLng([currentLat, currentLng]);
    },

    (error) => { /* verbessertes Error-Handling */ },

    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }
  );
}
</script>
</body>
</html>
