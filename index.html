<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS App PWA</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#007aff">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

body, html {
  margin: 0;
  padding: 0;
  font-family: Arial;
}

#map {
  width: 100%;
  height: 100vh;
}

#info {
  position: fixed;
  top: 10px;
  left: 10px;
  background: white;
  padding: 10px;
  border-radius: 10px;
  z-index: 9999;
}

button {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 20px;
  border: none;
  background: #007aff;
  color: white;
  border-radius: 12px;
  font-size: 16px;
  z-index: 9999;
}

</style>

</head>

<body>

<div id="info">GPS App startet...</div>

<button onclick="startGPS()">Start GPS</button>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map;
let marker;
let watchId;
let usingHighAccuracy = true;

function startWatching(highAccuracy) {
  usingHighAccuracy = highAccuracy;
  var mode = highAccuracy ? "GPS" : "Mobilfunk/WLAN";
  document.getElementById("info").innerHTML = "Suche Position (" + mode + ")...";

  watchId = navigator.geolocation.watchPosition(

    (pos) => {

      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;
      var mode = usingHighAccuracy ? "GPS" : "Mobilfunk/WLAN";

      document.getElementById("info").innerHTML =
        "Modus: " + mode +
        "<br>Lat: " + lat.toFixed(6) +
        "<br>Lng: " + lng.toFixed(6) +
        "<br>Genauigkeit: " + Math.round(acc) + "m";

      marker.setLatLng([lat,lng]);
      map.setView([lat,lng], 16);

    },

    (err) => {
      if (usingHighAccuracy) {
        document.getElementById("info").innerHTML = "Kein GPS-Signal – versuche Mobilfunk/WLAN...";
        navigator.geolocation.clearWatch(watchId);
        startWatching(false);
      } else {
        document.getElementById("info").innerHTML = "Keine Position gefunden.";
      }
    },

    {
      enableHighAccuracy: highAccuracy,
      maximumAge: highAccuracy ? 0 : 30000,
      timeout: 10000
    }
  );
}

function startGPS() {

  if (!navigator.geolocation) {
    alert("Geolocation wird nicht unterstützt");
    return;
  }

  map = L.map('map').setView([0,0], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  marker = L.marker([0,0]).addTo(map);

  startWatching(true);
}

// SERVICE WORKER

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
}

</script>

</body>
</html>
