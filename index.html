<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>GPS Tracker Cloud</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>

    html, body {

      margin: 0;
      padding: 0;

      height: 100%;

      font-family: Arial, sans-serif;
    }

    #map {

      width: 100%;
      height: 100vh;
    }

    /* ------------------------------------ */
    /* SIDE PANEL */
    /* ------------------------------------ */

    .side-panel {

      position: fixed;

      top: 0;
      left: -340px;

      width: 320px;
      height: 100%;

      background: white;

      z-index: 2000;

      padding: 16px;

      box-shadow: 2px 0 10px rgba(0,0,0,0.3);

      transition: left 0.3s ease;

      overflow-y: auto;
    }

    .side-panel.open {

      left: 0;
    }

    /* ------------------------------------ */
    /* MENU BUTTON */
    /* ------------------------------------ */

    #menuButton {

      position: fixed;

      top: 10px;
      left: 10px;

      z-index: 3000;

      width: 50px;
      height: 50px;

      border: none;

      border-radius: 10px;

      background: white;

      font-size: 28px;

      box-shadow: 0 0 10px rgba(0,0,0,0.3);

      cursor: pointer;
    }

    /* ------------------------------------ */
    /* CENTER BUTTON */
    /* ------------------------------------ */

    #centerButton {

      position: fixed;

      top: 70px;
      left: 10px;

      z-index: 3000;

      width: 50px;
      height: 50px;

      border: none;

      border-radius: 10px;

      background: white;

      font-size: 24px;

      box-shadow: 0 0 10px rgba(0,0,0,0.3);

      cursor: pointer;
    }

    /* ------------------------------------ */
    /* BUTTONS */
    /* ------------------------------------ */

    button {

      width: 100%;

      padding: 12px;

      margin-top: 8px;

      font-size: 16px;

      cursor: pointer;
    }

    h3, h4 {

      margin-top: 0;
    }

    /* ------------------------------------ */
    /* ROUTE ITEMS */
    /* ------------------------------------ */

    .routeItem {

      border: 1px solid #ccc;

      border-radius: 10px;

      padding: 10px;

      margin-top: 10px;
    }

  </style>
</head>

<body>

<!-- ------------------------------------ -->
<!-- SIDE PANEL -->
<!-- ------------------------------------ -->

<div id="sidePanel" class="side-panel">

  <h3 id="appTitle"></h3>

  <div id="status">
    Warte auf Standort...
  </div>

  <!-- Neue Route -->

  <button
    id="newRouteBtn"
    onclick="createNewRoute()"
  >
    Neue Route
  </button>

  <!-- Tracking starten -->

  <button
    id="startTrackingBtn"
    onclick="enableRouteTracking()"
    style="display:none;"
  >
    Tracking starten
  </button>

  <!-- Tracking stoppen -->

  <button
    id="stopTrackingBtn"
    onclick="stopRouteTracking()"
    style="display:none;"
  >
    Tracking stoppen
  </button>

  <!-- Route löschen -->

  <button
    id="clearRouteBtn"
    onclick="clearRoute()"
    style="display:none;"
  >
    Route löschen
  </button>

  <hr>

  <!-- Cloud Routen -->

  <h4>Cloud Routen</h4>

  <div id="savedRoutesList">
    Lade Routen...
  </div>

</div>

<!-- ------------------------------------ -->
<!-- MENU -->
<!-- ------------------------------------ -->

<button
  id="menuButton"
  onclick="togglePanel()"
>
☰
</button>

<!-- ------------------------------------ -->
<!-- CENTER -->
<!-- ------------------------------------ -->

<button
  id="centerButton"
  onclick="centerMap()"
>
◎
</button>

<!-- ------------------------------------ -->
<!-- MAP -->
<!-- ------------------------------------ -->

<div id="map"></div>

<!-- Leaflet -->

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Firebase -->

<script type="module">

// ------------------------------------
// Firebase Imports
// ------------------------------------

import {

  initializeApp

} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

  getFirestore,
  collection,
  addDoc,
  getDocs

} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ------------------------------------
// FIREBASE CONFIG
// ------------------------------------

const firebaseConfig = {

  apiKey:
    "AIzaSyBG-_8LeU72a-mj-zNyezr4zlXtJoHxi9c",

  authDomain:
    "ras-gps-route.firebaseapp.com",

  projectId:
    "ras-gps-route",

  storageBucket:
    "ras-gps-route.firebasestorage.app",

  messagingSenderId:
    "200005558812",

  appId:
    "1:200005558812:web:a6a89a131a35aad57ab5d9"
};

// ------------------------------------
// Firebase starten
// ------------------------------------

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

// ------------------------------------
// VERSION
// ------------------------------------

const APP_VERSION =
  document.lastModified;

document.getElementById(
  "appTitle"
).innerText =
  `GPS Tracking Cloud ${APP_VERSION}`;

// ------------------------------------
// Variablen
// ------------------------------------

let map;

let marker;

let circle;

let watchId;

let trackingActive = false;

let routeCoordinates = [];

let routeLine;

let currentLat = null;

let currentLng = null;

let routeName = "";

let routeDate = "";

// ------------------------------------
// Karte
// ------------------------------------

map = L.map('map')
.setView([51.505, -0.09], 13);

// ------------------------------------
// OpenStreetMap
// ------------------------------------

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution:
      '&copy; OpenStreetMap contributors'
  }
).addTo(map);

// ------------------------------------
// Marker
// ------------------------------------

marker =
  L.marker([51.505, -0.09])
  .addTo(map);

// ------------------------------------
// Genauigkeitskreis
// ------------------------------------

circle =
  L.circle([51.505, -0.09], {
    radius: 50
  }).addTo(map);

// ------------------------------------
// GPS sofort starten
// ------------------------------------

startLocationUpdates(false);

// ------------------------------------
// Cloud Routen laden
// ------------------------------------

loadRoutes();

// ------------------------------------
// GPS Funktion
// ------------------------------------

function startLocationUpdates(
  saveRoute = false
) {

  if (!navigator.geolocation) {

    alert(
      "Geolocation nicht unterstützt"
    );

    return;
  }

  watchId =
    navigator.geolocation.watchPosition(

      async (position) => {

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;

        const accuracy =
          position.coords.accuracy;

        currentLat = lat;

        currentLng = lng;

        // Marker

        marker.setLatLng([lat, lng]);

        // Kreis

        circle.setLatLng([lat, lng]);

        circle.setRadius(accuracy);

        // Popup

        marker.bindPopup(`
          <b>Du bist hier</b><br>
          Genauigkeit:
          ${Math.round(accuracy)} m
        `);

        // Erste Zentrierung

        if (!window.initialCentered) {

          map.setView([lat, lng], 17);

          window.initialCentered = true;
        }

        // Route speichern

        if (
          saveRoute &&
          trackingActive
        ) {

          routeCoordinates.push(
            [lat, lng]
          );

          if (routeLine) {

            map.removeLayer(routeLine);
          }

          routeLine =
            L.polyline(
              routeCoordinates,
              {
                color: 'blue'
              }
            ).addTo(map);
        }

        // Adresse holen

        let address =
          "Adresse unbekannt";

        try {

          const response =
            await fetch(
              `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`
            );

          const data =
            await response.json();

          if (data.display_name) {

            address =
              data.display_name;
          }

        } catch (err) {

          console.error(err);
        }

        // Status

        document.getElementById(
          "status"
        ).innerHTML = `

          <b>Route:</b><br>
          ${routeName || "Keine"}<br><br>

          <b>Datum:</b><br>
          ${routeDate || "-"}<br><br>

          <b>Breitengrad:</b><br>
          ${lat.toFixed(6)}<br><br>

          <b>Längengrad:</b><br>
          ${lng.toFixed(6)}<br><br>

          <b>Genauigkeit:</b><br>
          ${Math.round(accuracy)} m<br><br>

          <b>Adresse:</b><br>
          ${address}<br><br>

          <b>Tracking aktiv:</b><br>
          ${trackingActive ? "JA" : "NEIN"}<br><br>

          <b>Punkte:</b><br>
          ${routeCoordinates.length}

        `;
      },

      (error) => {

        console.error(error);

        alert("GPS Fehler");
      },

      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }
    );
}

// ------------------------------------
// Neue Route
// ------------------------------------

window.createNewRoute =
function () {

  routeName =
    prompt(
      "Name der Route:"
    );

  if (!routeName) {

    return;
  }

  const today =
    new Date()
    .toLocaleDateString();

  routeDate =
    prompt(
      "Datum:",
      today
    );

  if (!routeDate) {

    routeDate = today;
  }

  routeCoordinates = [];

  if (routeLine) {

    map.removeLayer(routeLine);
  }

  document.getElementById(
    "startTrackingBtn"
  ).style.display = "block";

  document.getElementById(
    "clearRouteBtn"
  ).style.display = "block";

  document.getElementById(
    "stopTrackingBtn"
  ).style.display = "none";

  alert(
    "Neue Route erstellt"
  );
};

// ------------------------------------
// Tracking starten
// ------------------------------------

window.enableRouteTracking =
function () {

  trackingActive = true;

  document.getElementById(
    "startTrackingBtn"
  ).style.display = "none";

  document.getElementById(
    "stopTrackingBtn"
  ).style.display = "block";

  if (watchId) {

    navigator.geolocation
    .clearWatch(watchId);
  }

  startLocationUpdates(true);

  alert(
    "Tracking gestartet"
  );
};

// ------------------------------------
// Tracking stoppen
// ------------------------------------

window.stopRouteTracking =
async function () {

  trackingActive = false;

  // In Firebase speichern

  try {

    await addDoc(

      collection(db, "routes"),

      {
        name: routeName,

        date: routeDate,

        points: routeCoordinates,

        created:
          new Date()
      }
    );

  } catch (err) {

    console.error(err);

    alert(
      "Fehler beim Speichern"
    );
  }

  // Routen neu laden

  loadRoutes();

  document.getElementById(
    "startTrackingBtn"
  ).style.display = "none";

  document.getElementById(
    "stopTrackingBtn"
  ).style.display = "none";

  alert(
    "Route gespeichert"
  );
};

// ------------------------------------
// Cloud Routen laden
// ------------------------------------

async function loadRoutes() {

  const list =
    document.getElementById(
      "savedRoutesList"
    );

  list.innerHTML = "";

  const querySnapshot =
    await getDocs(
      collection(db, "routes")
    );

  querySnapshot.forEach((doc) => {

    const route = doc.data();

    list.innerHTML += `

      <div class="routeItem">

        <b>${route.name}</b><br>

        ${route.date}<br>

        Punkte:
        ${route.points.length}

      </div>
    `;
  });

  if (list.innerHTML === "") {

    list.innerHTML =
      "Keine Routen";
  }
}

// ------------------------------------
// Route löschen
// ------------------------------------

window.clearRoute =
function () {

  routeCoordinates = [];

  routeName = "";

  routeDate = "";

  if (routeLine) {

    map.removeLayer(routeLine);
  }

  document.getElementById(
    "startTrackingBtn"
  ).style.display = "none";

  document.getElementById(
    "stopTrackingBtn"
  ).style.display = "none";

  document.getElementById(
    "clearRouteBtn"
  ).style.display = "none";

  alert(
    "Route gelöscht"
  );
};

// ------------------------------------
// Menü öffnen/schließen
// ------------------------------------

window.togglePanel =
function () {

  document
    .getElementById("sidePanel")
    .classList.toggle("open");
};

// ------------------------------------
// Karte zentrieren
// ------------------------------------

window.centerMap =
function () {

  if (
    currentLat &&
    currentLng
  ) {

    map.setView(
      [currentLat, currentLng],
      17
    );
  }
};

// ------------------------------------
// Swipe
// ------------------------------------

let touchStartX = 0;

document.addEventListener(
  "touchstart",
  (e) => {

    touchStartX =
      e.changedTouches[0].screenX;
  }
);

document.addEventListener(
  "touchend",
  (e) => {

    const touchEndX =
      e.changedTouches[0].screenX;

    // Öffnen

    if (
      touchEndX - touchStartX > 80
    ) {

      document
        .getElementById(
          "sidePanel"
        )
        .classList.add("open");
    }

    // Schließen

    if (
      touchStartX - touchEndX > 80
    ) {

      document
        .getElementById(
          "sidePanel"
        )
        .classList.remove("open");
    }
  }
);

</script>

</body>
</html>
