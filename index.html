<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS App PWA</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#007aff">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

body, html {
  margin: 0;
  padding: 0;
  font-family: Arial;
}

#map {
  width: 100%;
  height: 100vh;
}

#info {
  position: fixed;
  top: 10px;
  left: 10px;
  background: white;
  padding: 10px;
  border-radius: 10px;
  z-index: 9999;
  font-size: 14px;
}

#btnGps {
  position: fixed;
  bottom: 20px;
  left: 20px;
  right: 50%;
  margin-right: 10px;
  padding: 14px 0;
  border: none;
  background: #007aff;
  color: white;
  border-radius: 12px;
  font-size: 16px;
  z-index: 9999;
  cursor: pointer;
}

#btnRecord {
  position: fixed;
  bottom: 20px;
  left: 50%;
  right: 20px;
  margin-left: 10px;
  padding: 14px 0;
  border: none;
  background: #34c759;
  color: white;
  border-radius: 12px;
  font-size: 16px;
  z-index: 9999;
  cursor: pointer;
  display: none;
}

#btnRecord.active {
  background: #ff3b30;
}

</style>

</head>

<body>

<div id="info">GPS App startet...</div>

<button id="btnGps" onclick="startGPS()">Start GPS</button>
<button id="btnRecord" onclick="toggleRecording()">Aufzeichnung</button>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>

let map;
let marker;
let watchId;
let usingHighAccuracy = true;

let routePoints = [];
let routeLine;
let isRecording = false;
let totalDistance = 0;

function calcDistance(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function updateInfo(lat, lng, acc) {
  let mode = usingHighAccuracy ? "GPS" : "Mobilfunk/WLAN";
  let html = "Modus: " + mode +
    "<br>Lat: " + lat.toFixed(6) +
    "<br>Lng: " + lng.toFixed(6) +
    "<br>Genauigkeit: " + Math.round(acc) + "m";
  if (isRecording) {
    html += "<br><b>Aufzeichnung läuft</b>" +
      "<br>Strecke: " + (totalDistance / 1000).toFixed(2) + " km";
  }
  document.getElementById("info").innerHTML = html;
}

function startWatching(highAccuracy) {
  usingHighAccuracy = highAccuracy;
  let mode = highAccuracy ? "GPS" : "Mobilfunk/WLAN";
  document.getElementById("info").innerHTML = "Suche Position (" + mode + ")...";

  watchId = navigator.geolocation.watchPosition(

    (pos) => {

      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;

      if (isRecording) {
        let last = routePoints.length > 0 ? routePoints[routePoints.length - 1] : null;
        if (last) {
          totalDistance += calcDistance(last[0], last[1], lat, lng);
        }
        routePoints.push([lat, lng]);
        if (routeLine) {
          routeLine.setLatLngs(routePoints);
        }
      }

      updateInfo(lat, lng, acc);

      if (marker && map) {
        marker.setLatLng([lat, lng]);
        map.setView([lat, lng], 16);
      }

    },

    (err) => {
      var info = document.getElementById("info");
      if (usingHighAccuracy) {
        info.innerHTML = "GPS: " + err.message + "<br>– versuche Mobilfunk/WLAN...";
        navigator.geolocation.clearWatch(watchId);
        startWatching(false);
      } else {
        info.innerHTML = "Fehler: " + err.message;
      }
    },

    {
      enableHighAccuracy: highAccuracy,
      maximumAge: highAccuracy ? 0 : 30000,
      timeout: 5000
    }
  );
}

function startGPS() {

  if (!navigator.geolocation) {
    alert("Geolocation wird nicht unterstützt");
    return;
  }

  startWatching(true);

  try {
    map = L.map('map').setView([0,0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);
    marker = L.marker([0,0]).addTo(map);
    document.getElementById("btnRecord").style.display = "block";
  } catch (e) {
    document.getElementById("info").innerHTML += "<br><small>Karte nicht verfügbar</small>";
  }
}

function buildGeoJSON() {
  return {
    type: "FeatureCollection",
    features: [{
      type: "Feature",
      properties: {
        timestamp: new Date().toISOString(),
        totalDistance: totalDistance
      },
      geometry: {
        type: "LineString",
        coordinates: routePoints.map(p => [p[1], p[0]])
      }
    }]
  };
}

function saveToFirebase() {
  console.log("saveToFirebase called, points:", routePoints.length);
  if (routePoints.length < 2) {
    console.log("Zu wenig Punkte");
    return;
  }
  const data = buildGeoJSON();
  console.log("GeoJSON:", JSON.stringify(data).slice(0, 100) + "...");
  db.collection("routes").add(data)
    .then((docRef) => {
      console.log("Gespeichert mit ID:", docRef.id);
      var info = document.getElementById("info");
      info.innerHTML += "<br><small>✓ Gespeichert (ID: " + docRef.id + ")</small>";
    })
    .catch((err) => {
      console.error("Firebase Fehler:", err);
      var info = document.getElementById("info");
      info.innerHTML += "<br><small>✗ " + err.message + "</small>";
    });
}

function toggleRecording() {
  isRecording = !isRecording;
  var btn = document.getElementById("btnRecord");
  if (isRecording) {
    routePoints = [];
    totalDistance = 0;
    routeLine = L.polyline([], { color: "red", weight: 4 }).addTo(map);
    btn.innerHTML = "● Stopp";
    btn.className = "active";
  } else {
    btn.innerHTML = "Aufzeichnung";
    btn.className = "";
    saveToFirebase();
  }
}

// FIREBASE

const firebaseConfig = {
  apiKey: "AIzaSyBg_-8LeU72a-mj_zNyezr4zlXtJoHxi9c",
  authDomain: "ras-gps-route.firebaseapp.com",
  projectId: "ras-gps-route",
  storageBucket: "ras-gps-route.firebasestorage.app",
  messagingSenderId: "200005558812",
  appId: "1:200005558812:web:a6a89a131a35aad57ab5d9",
  measurementId: "G-XSDK7SVJ0L"
};

console.log("Firebase init...");
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
console.log("Firestore DB:", !!db);
firebase.auth().signInAnonymously()
  .then((cred) => console.log("Auth OK, UID:", cred.user.uid))
  .catch(e => console.error("Auth Fehler:", e));

// SERVICE WORKER

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
}

</script>

</body>
</html>
