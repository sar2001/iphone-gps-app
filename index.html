<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>iPhone GPS Tracker</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .info {

      position: absolute;

      top: 10px;
      left: 10px;

      z-index: 1000;

      background: white;

      padding: 12px;

      border-radius: 12px;

      box-shadow: 0 0 10px rgba(0,0,0,0.2);

      width: 320px;

      max-height: 85vh;

      overflow-y: auto;
    }

    button {

      width: 100%;

      padding: 12px;

      margin-top: 8px;

      font-size: 16px;

      cursor: pointer;
    }

    h3 {
      margin-top: 0;
    }

  </style>
</head>

<body>

<div class="info">

  <h3>GPS Tracking</h3>

  <div id="status">
    Warte auf Standort...
  </div>

  <button onclick="enableRouteTracking()">
    Tracking starten
  </button>

  <button onclick="stopRouteTracking()">
    Tracking stoppen
  </button>

  <button onclick="clearRoute()">
    Route löschen
  </button>

</div>

<div id="map"></div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ------------------------------------
// Variablen
// ------------------------------------

let map;
let marker;
let circle;

let watchId;

let trackingActive = false;

let routeCoordinates = [];

let routeLine;

// ------------------------------------
// Karte initialisieren
// ------------------------------------

map = L.map('map').setView([51.505, -0.09], 13);

// OpenStreetMap Layer
L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '&copy; OpenStreetMap contributors'
  }
).addTo(map);

// Marker
marker = L.marker([51.505, -0.09]).addTo(map);

// Genauigkeitskreis
circle = L.circle([51.505, -0.09], {
  radius: 50
}).addTo(map);

// ------------------------------------
// Gespeicherte Route laden
// ------------------------------------

const savedRoute = localStorage.getItem("savedRoute");

if (savedRoute) {

  routeCoordinates = JSON.parse(savedRoute);

  routeLine = L.polyline(routeCoordinates).addTo(map);
}

// ------------------------------------
// GPS sofort starten
// NUR Anzeige
// KEIN Speichern
// ------------------------------------

startLocationUpdates(false);

// ------------------------------------
// GPS Funktion
// ------------------------------------

function startLocationUpdates(saveRoute = false) {

  if (!navigator.geolocation) {

    alert("Geolocation nicht unterstützt");

    return;
  }

  watchId = navigator.geolocation.watchPosition(

    async (position) => {

      const lat = position.coords.latitude;

      const lng = position.coords.longitude;

      const accuracy = position.coords.accuracy;

      // ------------------------------------
      // Marker aktualisieren
      // ------------------------------------

      marker.setLatLng([lat, lng]);

      // ------------------------------------
      // Kreis aktualisieren
      // ------------------------------------

      circle.setLatLng([lat, lng]);

      circle.setRadius(accuracy);

      // ------------------------------------
      // Karte zentrieren
      // ------------------------------------

      map.setView([lat, lng], 17);

      // ------------------------------------
      // Popup
      // ------------------------------------

      marker.bindPopup(`
        <b>Du bist hier</b><br>
        Genauigkeit: ${Math.round(accuracy)} m
      `).openPopup();

      // ------------------------------------
      // Route speichern NUR wenn aktiv
      // ------------------------------------

      if (saveRoute && trackingActive) {

        // Punkt speichern
        routeCoordinates.push([lat, lng]);

        // localStorage speichern
        localStorage.setItem(
          "savedRoute",
          JSON.stringify(routeCoordinates)
        );

        // Alte Route entfernen
        if (routeLine) {

          map.removeLayer(routeLine);
        }

        // Neue Route zeichnen
        routeLine = L.polyline(routeCoordinates).addTo(map);
      }

      // ------------------------------------
      // Adresse holen
      // ------------------------------------

      let address = "Adresse unbekannt";

      try {

        const response = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`
        );

        const data = await response.json();

        if (data.display_name) {

          address = data.display_name;
        }

      } catch (err) {

        console.error(err);
      }

      // ------------------------------------
      // Status anzeigen
      // ------------------------------------

      document.getElementById("status").innerHTML = `

        <b>Breitengrad:</b><br>
        ${lat.toFixed(6)}<br><br>

        <b>Längengrad:</b><br>
        ${lng.toFixed(6)}<br><br>

        <b>Genauigkeit:</b><br>
        ${Math.round(accuracy)} m<br><br>

        <b>Aktuelle Adresse:</b><br>
        ${address}<br><br>

        <b>Tracking aktiv:</b><br>
        ${trackingActive ? "JA" : "NEIN"}<br><br>

        <b>Gespeicherte Punkte:</b><br>
        ${routeCoordinates.length}
      `;
    },

    (error) => {

      console.error(error);

      switch(error.code) {

        case error.PERMISSION_DENIED:

          alert("Standortzugriff verweigert");

          break;

        case error.POSITION_UNAVAILABLE:

          alert("Position nicht verfügbar");

          break;

        case error.TIMEOUT:

          alert("Zeitüberschreitung");

          break;

        default:

          alert("Unbekannter Fehler");
      }
    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}

// ------------------------------------
// Tracking STARTEN
// ------------------------------------

function enableRouteTracking() {

  trackingActive = true;

  // Alte GPS Überwachung stoppen
  if (watchId) {

    navigator.geolocation.clearWatch(watchId);
  }

  // GPS neu starten + speichern aktivieren
  startLocationUpdates(true);

  alert("Routenaufzeichnung gestartet");
}

// ------------------------------------
// Tracking STOPPEN
// ------------------------------------

function stopRouteTracking() {

  trackingActive = false;

  // GPS stoppen
  if (watchId) {

    navigator.geolocation.clearWatch(watchId);
  }

  // GPS neu starten OHNE speichern
  startLocationUpdates(false);

  alert("Routenaufzeichnung gestoppt");
}

// ------------------------------------
// Route löschen
// ------------------------------------

function clearRoute() {

  routeCoordinates = [];

  localStorage.removeItem("savedRoute");

  if (routeLine) {

    map.removeLayer(routeLine);
  }

  alert("Route gelöscht");
}

</script>

</body>
</html>
