<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS App PWA</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#007aff">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

body, html {
  margin: 0;
  padding: 0;
  font-family: Arial;
}

#map {
  width: 100%;
  height: 100vh;
}

#info {
  position: fixed;
  top: 10px;
  left: 10px;
  background: white;
  padding: 10px;
  border-radius: 10px;
  z-index: 9999;
  font-size: 14px;
}

#btnGps {
  position: fixed;
  bottom: 20px;
  left: 20px;
  right: 66%;
  margin-right: 6px;
  padding: 14px 0;
  border: none;
  background: #007aff;
  color: white;
  border-radius: 12px;
  font-size: 16px;
  z-index: 9999;
  cursor: pointer;
}

#btnRecord {
  position: fixed;
  bottom: 20px;
  left: 34%;
  right: 34%;
  margin: 0 6px;
  padding: 14px 0;
  border: none;
  background: #34c759;
  color: white;
  border-radius: 12px;
  font-size: 16px;
  z-index: 9999;
  cursor: pointer;
  display: none;
}

#btnRecord.active {
  background: #ff3b30;
}

#btnRoutes {
  position: fixed;
  bottom: 20px;
  left: 66%;
  right: 20px;
  margin-left: 6px;
  padding: 14px 0;
  border: none;
  background: #ff9500;
  color: white;
  border-radius: 12px;
  font-size: 16px;
  z-index: 9999;
  cursor: pointer;
  display: none;
}

</style>

</head>

<body>

<div id="info">GPS App startet...</div>

<button id="btnGps" onclick="startGPS()">Start GPS</button>
<button id="btnRecord" onclick="toggleRecording()">Aufzeichnung</button>
<button id="btnRoutes" onclick="loadRoutes()">Routen</button>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<!-- Firebase via REST API (kein SDK nötig) -->

<script>

let map;
let marker;
let watchId;
let usingHighAccuracy = true;

let routePoints = [];
let routeLine;
let isRecording = false;
let totalDistance = 0;
let firebaseStatus = "";
let viewMode = "gps";
let cachedRoutes = [];
let savedRouteLines = [];

function calcDistance(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function updateInfo(lat, lng, acc) {
  if (viewMode === "routes") return;
  let mode = usingHighAccuracy ? "GPS" : "Mobilfunk/WLAN";
  let html = "Modus: " + mode +
    "<br>Lat: " + lat.toFixed(6) +
    "<br>Lng: " + lng.toFixed(6) +
    "<br>Genauigkeit: " + Math.round(acc) + "m";
  if (isRecording) {
    html += "<br><b>Aufzeichnung läuft</b>" +
      "<br>Strecke: " + (totalDistance / 1000).toFixed(2) + " km";
  }
  if (firebaseStatus) {
    html += "<br><small>" + firebaseStatus + "</small>";
  }
  document.getElementById("info").innerHTML = html;
}

function startWatching(highAccuracy) {
  usingHighAccuracy = highAccuracy;
  let mode = highAccuracy ? "GPS" : "Mobilfunk/WLAN";
  document.getElementById("info").innerHTML = "Suche Position (" + mode + ")...";

  watchId = navigator.geolocation.watchPosition(

    (pos) => {

      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;

      if (isRecording) {
        let last = routePoints.length > 0 ? routePoints[routePoints.length - 1] : null;
        if (last) {
          totalDistance += calcDistance(last[0], last[1], lat, lng);
        }
        routePoints.push([lat, lng]);
        if (routeLine) {
          routeLine.setLatLngs(routePoints);
        }
      }

      updateInfo(lat, lng, acc);

      if (marker && map) {
        marker.setLatLng([lat, lng]);
        map.setView([lat, lng], 16);
      }

    },

    (err) => {
      var info = document.getElementById("info");
      if (usingHighAccuracy) {
        info.innerHTML = "GPS: " + err.message + "<br>– versuche Mobilfunk/WLAN...";
        navigator.geolocation.clearWatch(watchId);
        startWatching(false);
      } else {
        info.innerHTML = "Fehler: " + err.message;
      }
    },

    {
      enableHighAccuracy: highAccuracy,
      maximumAge: highAccuracy ? 0 : 30000,
      timeout: 5000
    }
  );
}

function startGPS() {

  if (!navigator.geolocation) {
    alert("Geolocation wird nicht unterstützt");
    return;
  }

  startWatching(true);

    try {
    map = L.map('map').setView([0,0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);
    marker = L.marker([0,0]).addTo(map);
    document.getElementById("btnRecord").style.display = "block";
    document.getElementById("btnRoutes").style.display = "block";
  } catch (e) {
    document.getElementById("info").innerHTML += "<br><small>Karte nicht verfügbar</small>";
  }
}

function buildGeoJSON() {
  return {
    type: "FeatureCollection",
    features: [{
      type: "Feature",
      properties: {
        timestamp: new Date().toISOString(),
        totalDistance: totalDistance
      },
      geometry: {
        type: "LineString",
        coordinates: routePoints.map(p => [p[1], p[0]])
      }
    }]
  };
}

function saveToFirebase(name) {
  if (routePoints.length < 2) {
    firebaseStatus = "✗ Zu wenig Punkte (" + routePoints.length + ")";
    return;
  }
  firebaseStatus = "Speichere... (" + routePoints.length + " Punkte)";
  var timeout = setTimeout(function() {
    if (firebaseStatus.indexOf("Speichere") === 0)
      firebaseStatus = "⏳ Timeout";
  }, 10000);
  try {
    const data = buildGeoJSON();
    fbSaveGeoJSON(data, name)
      .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
      .then(function(res) {
        clearTimeout(timeout);
        if (res.ok) {
          var id = res.data.name.split("/").pop();
          firebaseStatus = "✓ " + name + " gespeichert (" + id.slice(0,6) + ")";
        } else {
          var msg = res.data.error && res.data.error.message ? res.data.error.message :
                    res.data.error ? (typeof res.data.error === "string" ? res.data.error : JSON.stringify(res.data.error)) :
                    JSON.stringify(res.data);
          firebaseStatus = "✗ " + msg;
        }
      })
      .catch(function(err) {
        clearTimeout(timeout);
        firebaseStatus = "✗ " + err.message;
        console.error("Firebase:", err);
      });
  } catch (e) {
    clearTimeout(timeout);
    firebaseStatus = "✗ Crash: " + e.message;
    console.error("saveToFirebase crash:", e);
  }
}

function toggleRecording() {
  isRecording = !isRecording;
  var btn = document.getElementById("btnRecord");
  if (isRecording) {
    routePoints = [];
    totalDistance = 0;
    routeLine = L.polyline([], { color: "red", weight: 4 }).addTo(map);
    btn.innerHTML = "● Stopp";
    btn.className = "active";
  } else {
    btn.innerHTML = "Aufzeichnung";
    btn.className = "";
    var routeName = prompt("Name der Route:", "Route " + new Date().toLocaleDateString("de-DE"));
    if (routeName) {
      saveToFirebase(routeName);
    } else {
      firebaseStatus = "✗ Abgebrochen";
    }
  }
}

// FIREBASE – REST API (ohne SDK)

const API_KEY = "AIzaSyBg_-8LeU72a-mj_zNyezr4zlXtJoHxi9c";
const PROJECT_ID = "ras-gps-route";
let fbToken = null;

function fbSignIn() {
  fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + API_KEY, {
    method: "POST",
    body: JSON.stringify({ returnSecureToken: true })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.idToken) {
      fbToken = d.idToken;
      firebaseStatus = "Firebase verbunden";
    } else {
      firebaseStatus = "Auth Fehler";
    }
  })
  .catch(function(e) {
    firebaseStatus = "Netzwerk Fehler";
    console.error(e);
  });
}

function fbFetchRoutes() {
  if (!fbToken) return Promise.reject("No token");
  var url = "https://firestore.googleapis.com/v1/projects/" + PROJECT_ID +
    "/databases/(default)/documents/routes?orderBy=timestamp%20desc";
  return fetch(url, {
    headers: { "Authorization": "Bearer " + fbToken }
  }).then(function(r) { return r.json(); });
}

function clearSavedRoutes() {
  for (var i = 0; i < savedRouteLines.length; i++) {
    map.removeLayer(savedRouteLines[i]);
  }
  savedRouteLines = [];
}

function showRoute(doc) {
  viewMode = "gps";
  clearSavedRoutes();
  var fields = doc.fields;
  var geo = JSON.parse(fields.geoJSON.stringValue);
  var coords = geo.features[0].geometry.coordinates.map(function(c) {
    return [c[1], c[0]];
  });
  var line = L.polyline(coords, { color: "#ff9500", weight: 5 }).addTo(map);
  savedRouteLines.push(line);
  map.fitBounds(line.getBounds().pad(0.1));
  var dist = (fields.totalDistance && fields.totalDistance.doubleValue
    ? fields.totalDistance.doubleValue : 0) / 1000;
  document.getElementById("info").innerHTML =
    "<b>" + (fields.name ? fields.name.stringValue : "Unbenannt") + "</b>" +
    "<br>" + dist.toFixed(2) + " km" +
    "<br>" + coords.length + " Punkte" +
    "<br><small>Routen laden zum Anzeigen aller</small>";
  document.getElementById("btnRoutes").innerHTML = "← Routen";
}

function loadRoutes() {
  if (!fbToken) { firebaseStatus = "✗ Nicht angemeldet"; return; }
  if (document.getElementById("btnRoutes").innerHTML.indexOf("←") === 0) {
    viewMode = "gps";
    document.getElementById("btnRoutes").innerHTML = "Routen";
    document.getElementById("info").innerHTML = "GPS läuft...";
    return;
  }
  fbFetchRoutes().then(function(data) {
    var docs = data.documents || [];
    if (docs.length === 0) {
      document.getElementById("info").innerHTML = "Keine Routen gefunden";
      return;
    }
    viewMode = "routes";
    clearSavedRoutes();
    cachedRoutes = docs;
    var html = "<b>Gespeicherte Routen:</b><br><small>Tippen zum Anzeigen</small>";
    for (var i = 0; i < docs.length; i++) {
      var f = docs[i].fields;
      var name = f.name ? f.name.stringValue : "Unbenannt";
      var dist = f.totalDistance ? (f.totalDistance.doubleValue / 1000).toFixed(2) : "?";
      html += "<br><a href='#' onclick='showRoute(cachedRoutes[" + i + "]);return false'>" +
        name + " (" + dist + " km)</a>";
    }
    document.getElementById("info").innerHTML = html;
    document.getElementById("btnRoutes").innerHTML = "← Zurück";
  }).catch(function(e) {
    document.getElementById("info").innerHTML = "Fehler beim Laden: " + e.message;
  });
}

function fbSaveGeoJSON(data, name) {
  if (!fbToken) {
    firebaseStatus = "✗ Nicht angemeldet";
    return Promise.reject("No token");
  }
  var url = "https://firestore.googleapis.com/v1/projects/" + PROJECT_ID +
    "/databases/(default)/documents/routes";
  var body = {
    fields: {
      type: { stringValue: data.type },
      name: { stringValue: name || "Unbenannt" },
      timestamp: { stringValue: new Date().toISOString() },
      totalDistance: { doubleValue: data.features[0].properties.totalDistance },
      geoJSON: { stringValue: JSON.stringify(data) }
    }
  };
  return fetch(url, {
    method: "POST",
    headers: { "Authorization": "Bearer " + fbToken, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
}

fbSignIn();

// SERVICE WORKER

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
}

</script>

</body>
</html>
